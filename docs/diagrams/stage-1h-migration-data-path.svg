  <text x="42" y="632" class="s">disk bus: virtio</text>
  <text x="42" y="648" class="s">EFI, Secure Boot off</text>
  <text x="42" y="664" class="s">2 vCPU, 4096 Mi (.vmx)</text>
  <text x="42" y="680" class="s">runStrategy: Manual</text>

  <rect x="270" y="574" width="200" height="130" rx="8" class="fut" fill="#ffffff"/>
  <text x="282" y="596" class="t">virt-launcher pod</text>
  <text x="282" y="616" class="s">compute container:</text>
  <text x="282" y="632" class="s">libvirt 11.10 + QEMU 10.1</text>
  <text x="282" y="648" class="s">(CentOS Stream 9 builds)</text>
  <text x="282" y="664" class="s">Block PVC as raw device</text>

  <rect x="510" y="574" width="200" height="130" rx="8" class="fut" fill="#e0e7ff"/>
  <text x="522" y="596" class="t">QEMU/KVM</text>
  <text x="522" y="616" class="s">/dev/kvm from EC2 nested</text>
  <text x="522" y="632" class="s">virtualization (VT-x)</text>
  <text x="522" y="648" class="s">CentOS Stream 9 EL9 kernel</text>
  <text x="522" y="664" class="s">m8i.xlarge</text>

  <rect x="750" y="574" width="200" height="130" rx="8" class="fut" fill="#dcfce7"/>
  <text x="762" y="596" class="t">Ubuntu 24.04.5 guest</text>
  <text x="762" y="616" class="s">disk vda (virtio-blk)</text>
  <text x="762" y="632" class="s">same FS UUIDs, machine-id</text>
  <text x="762" y="648" class="s">NIC via masquerade, DHCP</text>
  <text x="762" y="664" class="s">10.0.2.2 (ADR 008)</text>

  <rect x="990" y="574" width="220" height="130" rx="8" class="fut" fill="#dcfce7"/>
  <text x="1002" y="596" class="t">nginx workload</text>
  <text x="1002" y="616" class="s">HTTP 200, 267 bytes</text>
  <text x="1002" y="632" class="s">page sha256 b9826e18...0046</text>
  <text x="1002" y="648" class="s">12 validation checks</text>
  <text x="1002" y="664" class="s">(Stage 1H section 21)</text>

  <path d="M230,640 L268,640" class="darr"/>
  <path d="M470,640 L508,640" class="darr"/>
  <path d="M710,640 L748,640" class="darr"/>
  <path d="M950,640 L988,640" class="darr"/>

  <!-- legend -->
  <rect x="30" y="724" width="1180" height="62" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
  <line x1="46" y1="746" x2="86" y2="746" class="arr"/>
  <text x="94" y="750" class="n">done, OBSERVED (Stages 1E to 1G)</text>
  <line x1="330" y1="746" x2="370" y2="746" class="darr"/>

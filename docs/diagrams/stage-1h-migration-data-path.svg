  <rect x="1030" y="52" width="180" height="24" rx="5" fill="#d97706"/>
  <text x="1040" y="69" class="l">Input format: VMDK</text>

  <rect x="30" y="84" width="200" height="160" rx="8" class="box" fill="#fee2e2"/>
  <text x="42" y="106" class="t">ESXi source disk</text>
  <text x="42" y="126" class="s">legacy-source-vm (running)</text>
  <text x="42" y="142" class="s">VMDK vmfs: descriptor +</text>
  <text x="42" y="158" class="s">40 GiB flat extent, PVSCSI</text>
  <text x="42" y="182" class="r">never modified</text>

  <rect x="270" y="84" width="200" height="160" rx="8" class="box" fill="#fef3c7"/>
  <text x="282" y="106" class="t">Golden VMDK</text>
  <text x="282" y="126" class="s">Windows, outside Git</text>
  <text x="282" y="142" class="s">flat sha256 72ca45c7...c9e7</text>
  <text x="282" y="158" class="s">ReadOnly attribute</text>
  <text x="282" y="182" class="r">read only, never converted</text>

  <rect x="510" y="84" width="200" height="160" rx="8" class="box" fill="#e0e7ff"/>
  <text x="522" y="106" class="t">Working copy</text>
  <text x="522" y="126" class="s">conversion-host-01</text>
  <text x="522" y="142" class="s">/srv/migration-lab/working/</text>
  <text x="522" y="158" class="s">mode 0444, chattr +i</text>
  <text x="522" y="174" class="s">hash = golden</text>

  <rect x="750" y="84" width="200" height="160" rx="8" class="box" fill="#dcfce7"/>
  <text x="762" y="106" class="t">Guest-aware conversion</text>
  <text x="762" y="126" class="s">virt-v2v 2.4.0</text>
  <text x="762" y="142" class="s">-i disk -o local -of qcow2</text>
  <text x="762" y="158" class="s">purges open-vm-tools,</text>
  <text x="762" y="174" class="s">rebuilds initramfs</text>
  <text x="762" y="190" class="s">netplan left unchanged</text>

  <rect x="990" y="84" width="220" height="160" rx="8" class="box" fill="#dcfce7"/>
  <text x="1002" y="106" class="t">KVM disk (kept artifact)</text>
  <text x="1002" y="126" class="s">qcow2, 40 GiB virtual,</text>
  <text x="1002" y="142" class="s">2.73 GiB file</text>
  <text x="1002" y="158" class="s">sha256 94bc1cd6...91c6</text>
  <text x="1002" y="174" class="s">boots under QEMU/KVM, UEFI</text>
  <text x="1002" y="198" class="r">kept read only, not edited</text>

  <path d="M230,164 L268,164" class="arr"/>
  <text x="236" y="156" class="s">1E</text>
  <path d="M470,164 L508,164" class="arr"/>
  <text x="476" y="156" class="s">1F</text>
  <path d="M710,164 L748,164" class="arr"/>
  <text x="716" y="156" class="s">1G</text>
  <path d="M950,164 L988,164" class="arr"/>
  <text x="44" y="226" class="s">cold scp, sha256 both ends</text>
  <text x="284" y="226" class="s">scp + re-sparsify, same hash</text>
  <text x="524" y="226" class="s">protected input only</text>
  <text x="764" y="226" class="s">136 s, new output path</text>

  <!-- connector to row 2 -->
  <path d="M1100,244 L1100,270 L130,270 L130,306" class="darr"/>

  <!-- Row 2: future -->
  <text x="30" y="298" class="c">Designed (future stage, not executed)</text>
  <rect x="1030" y="282" width="180" height="24" rx="5" fill="#2563eb"/>
  <text x="1040" y="299" class="l">Transfer format: qcow2</text>

  <rect x="30" y="314" width="200" height="190" rx="8" class="fut" fill="#f0fdf4"/>
  <text x="42" y="336" class="t">Prepared copy</text>
  <text x="42" y="356" class="s">new disposable copy of</text>
  <text x="42" y="372" class="s">the virt-v2v output:</text>
  <text x="42" y="390" class="s">netplan driver match, DHCP</text>
  <text x="42" y="406" class="s">(ADR 010)</text>
  <text x="42" y="424" class="s">qemu-guest-agent .deb</text>
  <text x="42" y="440" class="s">installed offline</text>
  <text x="42" y="456" class="s">first-boot apt jobs removed</text>
  <text x="42" y="474" class="s">qemu-img check, sha256,</text>
  <text x="42" y="490" class="s">read only</text>

  <rect x="270" y="314" width="200" height="190" rx="8" class="fut" fill="#f8fafc"/>
  <text x="282" y="336" class="t">Transfer to EC2 node</text>
  <text x="282" y="356" class="s">scp over SSH (operator /32)</text>
  <text x="282" y="372" class="s">about 2.7 GiB</text>
  <text x="282" y="390" class="s">sha256 on both ends</text>
  <text x="282" y="408" class="s">lands on the node's</text>
  <text x="282" y="424" class="s">50 GiB gp3 root volume</text>

  <rect x="510" y="314" width="200" height="190" rx="8" class="fut" fill="#f8fafc"/>
  <text x="522" y="336" class="t">Upload</text>
  <text x="522" y="356" class="s">kubectl port-forward</text>
  <text x="522" y="372" class="s">-n cdi svc/cdi-uploadproxy</text>
  <text x="522" y="390" class="s">virtctl image-upload dv</text>
  <text x="522" y="406" class="s">--size=40Gi</text>
  <text x="522" y="422" class="s">--volume-mode=block</text>
  <text x="522" y="438" class="s">--access-mode=ReadWriteOnce</text>
  <text x="522" y="454" class="s">--force-bind</text>
  <text x="522" y="474" class="g">proxy never exposed</text>

  <rect x="750" y="314" width="200" height="190" rx="8" class="fut" fill="#eff6ff"/>
  <text x="762" y="336" class="t">CDI v1.66.1</text>
  <text x="762" y="356" class="s">upload server receives</text>
  <text x="762" y="372" class="s">qcow2 into scratch PVC</text>
  <text x="762" y="388" class="s">(Filesystem, RWO)</text>
  <text x="762" y="406" class="s">qemu-img convert</text>
  <text x="762" y="422" class="s">qcow2 -> raw onto target</text>
  <text x="762" y="440" class="s">scratch deleted after</text>

  <rect x="990" y="314" width="220" height="190" rx="8" class="fut" fill="#e0f2fe"/>
  <text x="1002" y="336" class="t">DataVolume -> PVC</text>
  <text x="1002" y="356" class="s">DataVolume Succeeded</text>
  <text x="1002" y="372" class="s">PVC 40Gi, volumeMode Block,</text>
  <text x="1002" y="388" class="s">ReadWriteOnce, Bound</text>
  <text x="1002" y="406" class="s">EBS gp3 via EBS CSI,</text>
  <text x="1002" y="422" class="s">one AZ</text>
  <text x="1002" y="440" class="s">standalone (survives VM</text>
  <text x="1002" y="456" class="s">deletion)</text>

  <path d="M230,410 L268,410" class="darr"/>
  <path d="M470,410 L508,410" class="darr"/>
  <path d="M710,410 L748,410" class="darr"/>

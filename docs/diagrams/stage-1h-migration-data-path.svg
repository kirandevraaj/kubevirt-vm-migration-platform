<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" role="img" aria-labelledby="title desc">
  <title id="title">Stage 1H: migration data path from VMDK to a running KubeVirt VM (DESIGN for the future steps)</title>
  <desc id="desc">Row one shows the completed steps: the source VMDK on ESXi was cold-acquired in Stage 1E into a read-only golden copy on Windows, copied to an immutable working copy on conversion-host-01 in Stage 1F, and converted by virt-v2v into a KVM qcow2 disk in Stage 1G. Row two shows the designed future steps: a disposable copy receives the netplan remediation and an offline qemu-guest-agent install, is transferred to the EC2 node with sha256 checks, and is uploaded with virtctl through a port-forward to the CDI upload proxy. CDI stores the upload in Filesystem scratch space, converts qcow2 to raw with qemu-img, and writes it to a 40 GiB Block-mode ReadWriteOnce PVC on EBS gp3 behind a DataVolume. Row three shows the runtime: a VirtualMachine with a virtio disk and EFI boot runs in a virt-launcher pod, where QEMU uses KVM through nested virtualization to boot Ubuntu, which serves nginx. The disk format is VMDK at input, qcow2 in transit and raw at rest.</desc>

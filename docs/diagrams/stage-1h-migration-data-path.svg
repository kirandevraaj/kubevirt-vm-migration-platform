  <rect x="1030" y="542" width="180" height="24" rx="5" fill="#15803d"/>
  <text x="1040" y="559" class="l">Target format: raw Block</text>

  <rect x="30" y="574" width="200" height="130" rx="8" class="fut" fill="#ecfdf5"/>
  <text x="42" y="596" class="t">VirtualMachine</text>

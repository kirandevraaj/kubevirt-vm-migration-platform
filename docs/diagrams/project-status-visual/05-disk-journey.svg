<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
  <title id="title">The disk journey</title>
  <desc id="desc">The source VMDK (descriptor plus flat extent) on ESXi was copied cold in Stage 1E to the Windows golden artifact, then by scp in Stage 1F to the working copy on conversion-host-01. qemu-img produced a qcow2; virt-v2v produced a qcow2 plus libvirt XML. Both were booted in temporary QEMU/KVM test guests, which were deleted. Future part, designed and not built: qcow2, CDI, PVC, KubeVirt VM.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="m475569" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ma16207" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker></defs>
  <rect width="1200" height="1060" fill="#ffffff"/>
  <text x="600.0" y="44" class="h" text-anchor="middle">The disk journey</text>
  <text x="600.0" y="70" class="sub" text-anchor="middle">Where the migration disk actually is. Every copy is hashed; the original is never modified.</text>
  <rect x="70" y="100" width="560" height="74" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="350.0" y="123.3" class="t" text-anchor="middle" style="font-size:15px">ESXi: legacy-source-vm</text>
  <text x="350.0" y="142.25" class="s" text-anchor="middle" style="font-size:12.5px">/vmfs/volumes/migration-datastore/legacy-source-vm/</text>
  <text x="350.0" y="160.75" class="s" text-anchor="middle" style="font-size:12.5px">VMDK = 541-byte descriptor + 40 GiB thin flat extent</text>
  <rect x="561" y="90" width="59" height="20" rx="10.0" fill="#1d4ed8"/>
  <text x="590.5" y="103.96" class="pill" text-anchor="middle" style="font-size:11px">SOURCE</text>
  <path d="M350.0,176 L350.0,214" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <text x="362.0" y="200" class="xs" text-anchor="start" style="font-weight:600">Stage 1E cold acquisition (graceful shutdown, scp, sha256)</text>
  <rect x="70" y="216" width="560" height="74" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="350.0" y="239.3" class="t" text-anchor="middle" style="font-size:15px">WINDOWS GOLDEN ARTIFACT</text>
  <text x="350.0" y="258.25" class="s" text-anchor="middle" style="font-size:12.5px">C:\VMs\legacy-source-vm\stage-1e\</text>
  <text x="350.0" y="276.75" class="s" text-anchor="middle" style="font-size:12.5px">read-only, byte-identical (sha256 72ca45c7...c9e7)</text>
  <rect x="561" y="206" width="59" height="20" rx="10.0" fill="#a16207"/>
  <text x="590.5" y="219.96" class="pill" text-anchor="middle" style="font-size:11px">GOLDEN</text>
  <path d="M92.8,244 L92.8,237.7 A7.2,7.2 0 0 1 107.2,237.7 L107.2,244" fill="none" stroke="#a16207" stroke-width="3.15"/>

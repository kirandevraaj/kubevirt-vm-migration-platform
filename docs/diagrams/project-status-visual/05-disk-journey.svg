  <rect x="240" y="802" width="220" height="48" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="350.0" y="830.48" class="t" text-anchor="middle" style="font-size:14px">deleted after each test</text>
  <text x="350.0" y="884" class="t" text-anchor="middle" style="font-size:15px">All of these files live outside Git.</text>
  <text x="350.0" y="908" class="xs" text-anchor="middle">Paths under /srv/migration-lab/ are on conversion-host-01.</text>

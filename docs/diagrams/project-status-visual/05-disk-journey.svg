  <text x="200.0" y="487.55" class="t" text-anchor="middle" style="font-size:15px">qemu-img</text>
  <text x="200.0" y="506.5" class="s" text-anchor="middle" style="font-size:12.5px">Path A: container only</text>
  <rect x="370" y="464" width="260" height="56" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="500.0" y="487.55" class="t" text-anchor="middle" style="font-size:15px">virt-v2v</text>

  <circle cx="100" cy="252.1" r="2.7" fill="#ffffff"/>
  <path d="M350.0,292 L350.0,330" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <text x="362.0" y="316" class="xs" text-anchor="start" style="font-weight:600">Stage 1F scp, hash-verified</text>

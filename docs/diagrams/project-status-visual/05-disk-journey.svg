  <text x="350.0" y="355.3" class="t" text-anchor="middle" style="font-size:15px">CONVERSION HOST WORKING COPY</text>
  <text x="350.0" y="374.25" class="s" text-anchor="middle" style="font-size:12.5px">conversion-host-01: /srv/migration-lab/working/</text>
  <text x="350.0" y="392.75" class="s" text-anchor="middle" style="font-size:12.5px">0444 + immutable; the only input any tool reads</text>
  <rect x="554" y="322" width="66" height="20" rx="10.0" fill="#1d4ed8"/>
  <text x="587.0" y="335.96" class="pill" text-anchor="middle" style="font-size:11px">WORKING</text>

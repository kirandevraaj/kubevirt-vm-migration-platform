  <rect x="70" y="550" width="260" height="78" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="200.0" y="575.3" class="t" text-anchor="middle" style="font-size:15px">QCOW2</text>

  <rect x="240" y="540" width="80" height="20" rx="10.0" fill="#15803d"/>
  <text x="280.0" y="553.96" class="pill" text-anchor="middle" style="font-size:11px">CONVERTED</text>
  <rect x="370" y="550" width="260" height="78" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="500.0" y="575.3" class="t" text-anchor="middle" style="font-size:15px">QCOW2 + XML</text>
  <text x="500.0" y="594.25" class="s" text-anchor="middle" style="font-size:12.5px">stage-1g/virt-v2v/local-out/</text>
  <text x="500.0" y="612.75" class="s" text-anchor="middle" style="font-size:12.5px">+ remediated/ netfix copy</text>
  <rect x="540" y="540" width="80" height="20" rx="10.0" fill="#15803d"/>
  <text x="580.0" y="553.96" class="pill" text-anchor="middle" style="font-size:11px">CONVERTED</text>
  <path d="M200,630 L200,656 L500,656 L500,630 M350.0,656 L350.0,664" stroke="#475569" stroke-width="2.2" fill="none"/>
  <path d="M350.0,664 L350.0,690" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="130" y="692" width="440" height="74" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="350.0" y="715.3" class="t" text-anchor="middle" style="font-size:15px">TEMPORARY QEMU/KVM TEST GUEST</text>
  <text x="350.0" y="734.25" class="s" text-anchor="middle" style="font-size:12.5px">inside conversion-host-01, UEFI + virtio</text>
  <text x="350.0" y="752.75" class="s" text-anchor="middle" style="font-size:12.5px">booted a disposable overlay; nginx HTTP 200</text>
  <rect x="480" y="682" width="80" height="20" rx="10.0" fill="#b45309"/>
  <text x="520.0" y="695.96" class="pill" text-anchor="middle" style="font-size:11px">TEMPORARY</text>

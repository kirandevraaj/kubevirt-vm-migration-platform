  <title id="title">The entire project journey</title>
  <desc id="desc">Official stages on the left: Stage 0 complete, Stages 1A to 1G complete and proven, Stage 1H KubeVirt target designed and awaiting review (you are here), Stage 1I not yet defined. On the right, a proposed and not official path: first KubeVirt VM, actual VM migration, migration workflow, custom controller and CRD, GitOps, observability and security, modernization, native Kubernetes workload.</desc>

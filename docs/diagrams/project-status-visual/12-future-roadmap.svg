  <title id="title">Proposed future roadmap</title>
  <desc id="desc">Current: Stage 1H review. Everything after it is proposed and not official: define and approve Stage 1I, build the target platform, runtime validation, first KubeVirt boot, first actual VM migration, migration workflow, custom migration CRD and controller, failure and recovery, GitOps, observability, security, modernization, portfolio.</desc>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">Our current lab</title>
  <desc id="desc">Windows 11 runs VMware Workstation, which runs nested ESXi 8.0.3 at 192.168.50.11. On ESXi: legacy-source-vm (Vmid 2, 192.168.50.31, Ubuntu and nginx, PVSCSI, VMXNET3, the SOURCE), conversion-host-01 (Vmid 3, 192.168.50.32, qemu-img, libguestfs, virt-v2v, the CONVERSION host) and kvm-learning-01 (Vmid 1, powered off, LEARNING only).</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="m475569" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="920" fill="#ffffff"/>
  <text x="600.0" y="44" class="h" text-anchor="middle">Our current lab</text>
  <text x="600.0" y="70" class="sub" text-anchor="middle">Everything runs on one laptop. Power states as recorded after Stage 1H.</text>
  <rect x="380" y="100" width="440" height="58" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="600.0" y="124.55" class="t" text-anchor="middle" style="font-size:15px">Windows 11 laptop</text>
  <text x="600.0" y="143.5" class="s" text-anchor="middle" style="font-size:12.5px">Windows hypervisor off (so nested ESXi can use VT-x)</text>
  <path d="M600,160 L600,188" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="380" y="190" width="440" height="58" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="600.0" y="214.55" class="t" text-anchor="middle" style="font-size:15px">VMware Workstation 17.6.4</text>
  <text x="600.0" y="233.5" class="s" text-anchor="middle" style="font-size:12.5px">VMnet8 NAT network 192.168.50.0/24</text>
  <path d="M600,250 L600,278" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="340" y="280" width="520" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="600.0" y="311.19" class="t" text-anchor="middle" style="font-size:17px">Nested ESXi 8.0.3  (esxi-8-lab)</text>
  <text x="600.0" y="330.5" class="s" text-anchor="middle" style="font-size:12.5px">192.168.50.11  |  migration-datastore (VMFS-6)  |  no snapshots</text>
  <path d="M600,352 L600,390 M200,390 L1000,390" stroke="#475569" stroke-width="2.4" fill="none"/>
  <path d="M200,390 L200,424" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>

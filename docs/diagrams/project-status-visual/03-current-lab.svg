  <text x="87.0" y="431.68" class="pill" text-anchor="middle" style="font-size:13px">SOURCE</text>
  <rect x="259" y="416" width="87" height="20" rx="10.0" fill="#15803d"/>
  <text x="302.5" y="429.96" class="pill" text-anchor="middle" style="font-size:11px">POWERED ON</text>
  <text x="200" y="468" class="t" text-anchor="middle" style="font-size:20px">legacy-source-vm</text>
  <text x="200" y="506" class="s" text-anchor="middle" style="font-size:14.5px">Vmid 2   |   192.168.50.31</text>
  <text x="200" y="536" class="s" text-anchor="middle" style="font-size:14.5px">Ubuntu 24.04.5 + nginx</text>
  <text x="200" y="566" class="s" text-anchor="middle" style="font-size:14.5px">2 vCPU, 4096 MB, 40 GB thin, UEFI</text>
  <text x="200" y="596" class="s" text-anchor="middle" style="font-size:14.5px">PVSCSI disk, VMXNET3 NIC</text>
  <text x="200" y="626" class="s" text-anchor="middle" style="font-size:14.5px">static IP (netplan on ens192)</text>
  <rect x="440" y="426" width="320" height="250" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.4"/>
  <rect x="454" y="416" width="100" height="22" rx="11.0" fill="#b45309"/>
  <text x="504.0" y="431.68" class="pill" text-anchor="middle" style="font-size:13px">CONVERSION</text>
  <rect x="659" y="416" width="87" height="20" rx="10.0" fill="#15803d"/>
  <text x="702.5" y="429.96" class="pill" text-anchor="middle" style="font-size:11px">POWERED ON</text>
  <text x="600" y="468" class="t" text-anchor="middle" style="font-size:20px">conversion-host-01</text>
  <text x="600" y="506" class="s" text-anchor="middle" style="font-size:14.5px">Vmid 3   |   192.168.50.32</text>
  <text x="600" y="536" class="s" text-anchor="middle" style="font-size:14.5px">Ubuntu 24.04.5, 4 vCPU, 8 GB</text>
  <text x="600" y="566" class="s" text-anchor="middle" style="font-size:14.5px">qemu-img 8.2.2</text>
  <text x="600" y="596" class="s" text-anchor="middle" style="font-size:14.5px">libguestfs / guestfish 1.52.0</text>
  <text x="600" y="626" class="s" text-anchor="middle" style="font-size:14.5px">virt-v2v 2.4.0, QEMU + OVMF</text>
  <rect x="840" y="426" width="320" height="250" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2.4" stroke-dasharray="3 4"/>
  <rect x="854" y="416" width="83" height="22" rx="11.0" fill="#475569"/>
  <text x="895.5" y="431.68" class="pill" text-anchor="middle" style="font-size:13px">LEARNING</text>
  <rect x="1052" y="416" width="94" height="20" rx="10.0" fill="#475569"/>
  <text x="1099.0" y="429.96" class="pill" text-anchor="middle" style="font-size:11px">POWERED OFF</text>
  <text x="1000" y="468" class="t" text-anchor="middle" style="font-size:20px">kvm-learning-01</text>
  <text x="1000" y="506" class="s" text-anchor="middle" style="font-size:14.5px">Vmid 1   |   .30 when running</text>
  <text x="1000" y="536" class="s" text-anchor="middle" style="font-size:14.5px">Ubuntu 24.04.4</text>
  <text x="1000" y="566" class="s" text-anchor="middle" style="font-size:14.5px">KVM, QEMU 8.2.2, libvirt 10.0.0</text>
  <text x="1000" y="596" class="s" text-anchor="middle" style="font-size:14.5px">VirtIO, nested virtualization</text>
  <text x="1000" y="626" class="s" text-anchor="middle" style="font-size:14.5px">KVM learning only (Stage 1B)</text>
  <rect x="40" y="712" width="520" height="118" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="300.0" y="746.12" class="t" text-anchor="middle" style="font-size:16px">What is NOT in this lab</text>
  <text x="300.0" y="766.48" class="s" text-anchor="middle" style="font-size:14px">No Kubernetes, no KubeVirt, no CDI.</text>
  <text x="300.0" y="786.48" class="s" text-anchor="middle" style="font-size:14px">No AWS resource. The target exists only as a design.</text>
  <text x="300.0" y="806.48" class="s" text-anchor="middle" style="font-size:14px">No converted VM running anywhere.</text>
  <rect x="640" y="712" width="520" height="118" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="900.0" y="746.12" class="t" text-anchor="middle" style="font-size:16px">Where the disks are</text>
  <text x="900.0" y="766.48" class="s" text-anchor="middle" style="font-size:14px">Golden copy: Windows, C:\VMs\legacy-source-vm\stage-1e\</text>
  <text x="900.0" y="786.48" class="s" text-anchor="middle" style="font-size:14px">Working + converted copies: on conversion-host-01</text>
  <text x="900.0" y="806.48" class="s" text-anchor="middle" style="font-size:14px">Nothing of this is in Git.</text>
  <text x="600" y="880" class="t" text-anchor="middle" style="font-size:15px">Three roles on one ESXi host: migrate this, convert/inspect here, learn there.</text>

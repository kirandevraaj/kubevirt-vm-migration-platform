<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
  <title id="title">The Stage 1H KubeVirt target</title>
  <desc id="desc">Designed stack: AWS ap-south-1, EC2 m8i.xlarge with nested virtualization, CentOS Stream 9, Kubernetes 1.36 (kubeadm, single node), CRI-O 1.36, flannel, KubeVirt v1.9.0, CDI v1.66.1, VirtualMachine, virt-launcher pod, QEMU, KVM, Ubuntu 24.04.5, nginx. Storage: qcow2, CDI upload, PVC (gp3 Block RWO 40 GiB), VM. Network: masquerade, DHCP 10.0.2.2, Service NodePort 30080. Designed, not deployed.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="ma16207" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker></defs>

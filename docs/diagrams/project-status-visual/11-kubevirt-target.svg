  <text x="600" y="1000" class="s" text-anchor="middle" style="font-size:14px">About USD 0.24 per hour while running; Terraform apply and destroy per session (ADR 002). EKS deferred, not rejected.</text>
  <text x="600" y="1026" class="xs" text-anchor="middle">192.168.50.31 is not preserved. Continuity = same nginx page hash through the Service.</text>

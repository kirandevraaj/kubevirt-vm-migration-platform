<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="980" viewBox="0 0 1240 980" role="img" aria-labelledby="title desc">
  <title id="title">Stage 1G: controlled VMDK conversion and QEMU/KVM boot validation</title>
  <desc id="desc">The golden Stage 1E artifact on the Windows host stays read-only. On conversion-host-01 the protected working copy feeds two branches. Path A uses qemu-img for a container-only conversion to a temporary qcow2 disk whose guest content is identical. Path B uses virt-v2v 2.4.0 for a guest-aware conversion to a converted qcow2 disk plus libvirt XML; a second copy of it received one netplan remediation. All disks were booted one at a time under QEMU/KVM with OVMF UEFI, virtio-blk and virtio-net on an isolated user-mode network. The Ubuntu Server guest ran the nginx workload in every boot; only the remediated copy had working networking and returned HTTP 200 from outside the guest. legacy-source-vm kept running untouched, kvm-learning-01 stayed powered off, and KubeVirt/CDI remain future work.</desc>
  <style>
    .h { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .c { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .t { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #111827; }
    .s { font: 11.5px 'Segoe UI', Arial, sans-serif; fill: #374151; }
    .l { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
    .n { font: 12px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    .r { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #b91c1c; }
    .g { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #15803d; }
    .box { stroke: #334155; stroke-width: 1.3; }
    .dash { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 7 5; fill: #f8fafc; }
    .arr { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .darr { stroke: #94a3b8; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#g); }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1240" height="980" fill="#ffffff"/>
  <text x="620" y="32" text-anchor="middle" class="h">Stage 1G: controlled conversion and KVM boot validation (OBSERVED 2026-09-28)</text>

  <!-- Windows host with golden artifact -->
  <rect x="30" y="56" width="230" height="330" rx="10" class="box" fill="#f1f5f9"/>
  <text x="44" y="80" class="c">Windows 11 host (L0)</text>
  <text x="44" y="98" class="s">outside Git</text>
  <rect x="42" y="110" width="206" height="262" rx="8" class="box" fill="#fef3c7"/>
  <rect x="42" y="110" width="206" height="26" rx="8" fill="#d97706"/>
  <text x="52" y="128" class="l">GOLDEN (Stage 1E artifact)</text>
  <text x="52" y="156" class="t">READ-ONLY</text>
  <text x="52" y="174" class="s">C:\VMs\legacy-source-vm\stage-1e\</text>
  <text x="52" y="196" class="s">descriptor sha256 5b407e06...e9ff</text>
  <text x="52" y="214" class="s">flat 40 GiB sha256 72ca45c7...c9e7</text>
  <rect x="52" y="228" width="186" height="132" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="62" y="248" class="r">NEVER MODIFIED</text>
  <text x="62" y="268" class="s">Windows ReadOnly attribute</text>
  <text x="62" y="284" class="s">set in G2 (content unchanged)</text>
  <text x="62" y="304" class="s">hash, size, timestamps</text>
  <text x="62" y="320" class="s">identical at G2 and G10</text>
  <text x="62" y="340" class="s">no tool opened it except</text>
  <text x="62" y="356" class="s">Get-FileHash</text>

  <path d="M248,160 L302,160" class="arr"/>
  <text x="269" y="148" text-anchor="middle" class="s">1F</text>
  <text x="269" y="178" text-anchor="middle" class="s">scp</text>

  <!-- conversion-host-01 -->
  <rect x="290" y="56" width="650" height="660" rx="10" class="box" fill="#dbeafe"/>
  <text x="306" y="80" class="c">conversion-host-01 (Vmid 3, L2): tooling host (ADR 006)</text>
  <text x="306" y="98" class="s">Ubuntu 24.04.5, qemu 8.2.2, libguestfs 1.52.0, virt-v2v 2.4.0, ovmf 2024.02 (installed in G3)</text>

  <rect x="306" y="110" width="618" height="66" rx="8" class="box" fill="#dcfce7"/>
  <rect x="306" y="110" width="618" height="26" rx="8" fill="#16a34a"/>
  <text x="318" y="128" class="l">PROTECTED INPUT  /srv/migration-lab/working/  (0444 + chattr +i)</text>
  <text x="318" y="156" class="s">working copy of the golden disk, sha256 = golden; verified before and after every step; never converted in place</text>
  <text x="318" y="170" class="s">all outputs go to new paths under /srv/migration-lab/stage-1g/, are hashed and set read-only</text>

  <path d="M450,178 L450,204" class="arr"/>
  <path d="M780,178 L780,204" class="arr"/>

  <!-- Path A -->
  <rect x="306" y="208" width="300" height="118" rx="8" class="box" fill="#ffffff"/>
  <text x="318" y="228" class="t">PATH A: qemu-img convert</text>
  <text x="318" y="246" class="s">container conversion only</text>
  <text x="318" y="264" class="s">-f vmdk -O qcow2, 5 s</text>
  <text x="318" y="282" class="s">qemu-img check: no errors</text>
  <text x="318" y="300" class="g">compare: "Images are identical."</text>
  <text x="318" y="318" class="s">guest content untouched</text>
  <path d="M456,328 L456,352" class="arr"/>
  <rect x="306" y="356" width="300" height="70" rx="8" class="box" fill="#e0e7ff"/>
  <text x="318" y="376" class="t">temporary qcow2 disk</text>
  <text x="318" y="394" class="s">3.21 GiB allocated of 40 GiB virtual</text>
  <text x="318" y="412" class="s">sha256 08c62ac5...5447 (not a target format)</text>

  <!-- Path B -->
  <rect x="624" y="208" width="300" height="118" rx="8" class="box" fill="#ffffff"/>
  <text x="636" y="228" class="t">PATH B: virt-v2v 2.4.0</text>
  <text x="636" y="246" class="s">guest-aware conversion, 136 s</text>
  <text x="636" y="264" class="s">-i disk -if vmdk -o local -of qcow2</text>
  <text x="636" y="282" class="s">purges open-vm-tools, rebuilds initramfs,</text>
  <text x="636" y="300" class="s">adds firstboot (qemu-guest-agent install)</text>
  <text x="636" y="318" class="r">netplan ens192 NOT changed</text>
  <path d="M760,328 L760,352" class="arr"/>
  <rect x="624" y="356" width="300" height="70" rx="8" class="box" fill="#e0e7ff"/>
  <text x="636" y="376" class="t">converted disk + libvirt XML</text>
  <text x="636" y="394" class="s">qcow2 2.73 GiB, sha256 94bc1cd6...91c6</text>
  <text x="636" y="412" class="s">XML: q35, OVMF, virtio disk and NIC</text>
  <path d="M700,428 L700,452" class="arr"/>
  <text x="708" y="446" class="s">second full copy</text>
  <rect x="624" y="456" width="250" height="62" rx="8" class="box" fill="#fef9c3"/>
  <text x="636" y="476" class="t">remediated copy (netplan only)</text>
  <text x="636" y="494" class="s">match driver virtio_net, test IP</text>
  <text x="636" y="510" class="s">10.0.2.15 (never .31); virt-diff: 1 file</text>

  <!-- arrows into QEMU -->
  <path d="M456,428 L456,560" class="arr"/>
  <text x="464" y="500" class="s">boot 1</text>
  <path d="M905,428 L905,560" class="arr"/>
  <text x="897" y="500" text-anchor="end" class="s">boot 2</text>
  <path d="M750,520 L750,560" class="arr"/>
  <text x="758" y="544" class="s">boot 3</text>

  <!-- QEMU/KVM -->
  <rect x="306" y="564" width="618" height="62" rx="8" class="box" fill="#ffffff"/>
  <text x="318" y="584" class="t">QEMU/KVM, no libvirt: one test VM at a time (2 vCPU, 2048 MB), L3</text>
  <text x="318" y="602" class="s">q35, OVMF_CODE_4M.fd (Secure Boot off) + fresh varstore, virtio-blk, virtio-net, serial log; /dev/kvm used</text>
  <text x="318" y="618" class="s">isolated user-mode network 10.0.2.0/24 (restrict=on), host port forwards only; disposable qcow2 overlays, deleted</text>
  <path d="M615,628 L615,646" class="arr"/>

  <!-- guest + workload -->
  <rect x="306" y="650" width="618" height="58" rx="8" class="box" fill="#f0fdf4"/>
  <text x="318" y="669" class="t">Ubuntu Server 24.04.5 guest (UEFI fallback boot, vda, enp0s3)  -&gt;  nginx workload</text>
  <text x="318" y="686" class="s">boot 1 and boot 2: boots, nginx HTTP 200 inside the guest, NIC enp0s3 DOWN (netplan expects ens192)</text>
  <text x="318" y="702" class="g">boot 3: 10.0.2.15, default route, HTTP 200 from the host, page sha256 = source (b9826e18...0046)</text>

  <!-- future boundary -->
  <rect x="966" y="56" width="244" height="660" rx="10" class="dash"/>
  <text x="980" y="80" class="t">FUTURE - NOT STARTED</text>
  <rect x="982" y="100" width="212" height="210" rx="8" class="dash"/>
  <text x="994" y="124" class="t">KubeVirt / CDI</text>
  <text x="994" y="146" class="s">not installed: no Kubernetes,</text>
  <text x="994" y="162" class="s">no KubeVirt, no CDI, no AWS</text>
  <text x="994" y="186" class="s">target disk format still an</text>
  <text x="994" y="202" class="s">explicit decision</text>
  <text x="994" y="226" class="s">needs: EFI with Secure Boot off,</text>
  <text x="994" y="242" class="s">virtio bus, a network remediation</text>
  <text x="994" y="258" class="s">and binding decision, a guest-agent</text>
  <text x="994" y="274" class="s">decision</text>
  <text x="994" y="298" class="r">virt-v2v -o kubevirt NOT used</text>
  <rect x="982" y="330" width="212" height="96" rx="8" class="dash"/>
  <text x="994" y="354" class="t">Stage 1H</text>
  <text x="994" y="376" class="s">not started; needs explicit</text>
  <text x="994" y="392" class="s">approval</text>
  <text x="994" y="414" class="s">entry criteria: Stage 1G sec. 24</text>
  <path d="M926,680 C 950,680 950,210 978,210" class="darr"/>
  <rect x="936" y="440" width="30" height="22" fill="#ffffff"/>
  <text x="951" y="456" text-anchor="middle" class="r">NO</text>
  <text x="980" y="660" class="r">No migration, no cutover,</text>
  <text x="980" y="678" class="r">no .31 on any test guest</text>

  <!-- ESXi context -->
  <rect x="30" y="734" width="1180" height="130" rx="10" class="box" fill="#eff6ff"/>
  <text x="46" y="758" class="c">esxi-8-lab (L1: ESXi 8.0.3, 192.168.50.11): VMs during and after Stage 1G</text>
  <rect x="46" y="772" width="370" height="80" rx="6" class="box" fill="#e5e7eb"/>
  <text x="58" y="792" class="t">legacy-source-vm (Vmid 2), running, .31</text>
  <text x="58" y="810" class="s">UNTOUCHED: only HTTP health checks and ESXi</text>
  <text x="58" y="826" class="s">status queries; HTTP 200, page sha256 and</text>
  <text x="58" y="842" class="s">0 snapshots at G1 and G10</text>
  <rect x="430" y="772" width="370" height="80" rx="6" class="box" fill="#e5e7eb"/>
  <text x="442" y="792" class="t">kvm-learning-01 (Vmid 1), powered off</text>
  <text x="442" y="810" class="s">OFF: not used as a conversion host,</text>
  <text x="442" y="826" class="s">not powered on</text>
  <rect x="814" y="772" width="380" height="80" rx="6" class="box" fill="#dbeafe"/>
  <text x="826" y="792" class="t">conversion-host-01 (Vmid 3), running, .32</text>
  <text x="826" y="810" class="s">TOOLING HOST; ESXi memory 11,299 -&gt; 11,301 MB;</text>
  <text x="826" y="826" class="s">datastore free -9.2 GB (kept artifacts, 8.7 GB)</text>
  <text x="826" y="842" class="s">Windows free RAM stayed at 5.7 GiB or more</text>

  <!-- Legend -->
  <rect x="30" y="880" width="1180" height="88" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="46" y="902" class="t">Legend</text>
  <rect x="110" y="891" width="14" height="14" fill="#d97706"/><text x="130" y="903" class="n">golden artifact (read-only)</text>
  <rect x="320" y="891" width="14" height="14" fill="#16a34a"/><text x="340" y="903" class="n">protected working input</text>
  <rect x="510" y="891" width="14" height="14" fill="#e0e7ff" stroke="#334155"/><text x="530" y="903" class="n">conversion outputs (read-only, hashed)</text>
  <rect x="770" y="891" width="14" height="14" fill="#fef9c3" stroke="#334155"/><text x="790" y="903" class="n">disposable remediated copy</text>
  <rect x="970" y="891" width="14" height="14" fill="#e5e7eb" stroke="#334155"/><text x="990" y="903" class="n">other VMs, not touched</text>
  <text x="46" y="928" class="n">Solid boxes and arrows happened in this lab (OBSERVED). Dashed boxes and dashed arrows are future work that has not started. Red text marks what did not change or was not done.</text>
  <text x="46" y="950" class="n">Disk bytes flowed one way only: golden -&gt; working copy -&gt; outputs -&gt; overlays. Only text evidence came back to Windows. Overlays and varstores were deleted after each boot.</text>
</svg>

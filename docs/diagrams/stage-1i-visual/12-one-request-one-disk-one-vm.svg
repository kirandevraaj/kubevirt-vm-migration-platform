  <title id="title">One request, one disk, one VM</title>
  <desc id="desc">Three columns. One request: curl, 3.6.94.104:30080, security group, NodePort, Service 10.108.249.186, Pod 10.244.0.30, DNAT, guest 10.0.2.2:80, nginx, HTTP 200. One disk: golden VMDK, prepared qcow2, CDI upload, DataVolume, PVC, PV, EBS volume, /dev/rootdisk, guest vda. One VM: VirtualMachine, VMI, virt-launcher Pod, qemu-kvm, Ubuntu guest, nginx.</desc>

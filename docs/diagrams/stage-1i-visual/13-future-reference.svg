<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Future and reference items</title>
  <desc id="desc">Left, solid: what Stage 1I actually is (one VM, cold point-in-time, manual gates, single node, RWO storage, lift-and-shift, no controller). Right, dotted: future or reference items not implemented in Stage 1I: MTV/Forklift warm migration, a migration controller, the conceptual VirtualMachineMigration CRD, application modernization, multi-node production KubeVirt and RWX storage for live migration.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="m64748b" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="600.0" y="44" class="h" text-anchor="middle">Future / reference: NOT part of Stage 1I</text>
  <text x="600.0" y="70" class="sub" text-anchor="middle">Conceptual only - nothing on the right side is deployed or tested</text>
  <rect x="1026" y="84" width="144" height="20" rx="10.0" fill="#64748b"/>
  <text x="1098.0" y="97.96" class="pill" text-anchor="middle" style="font-size:11px">FUTURE / REFERENCE</text>
  <rect x="30" y="110" width="330" height="610" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="195" y="142" class="lab" text-anchor="middle" style="fill:#15803d">STAGE 1I TODAY</text>
  <rect x="158.5" y="152" width="73" height="20" rx="10.0" fill="#15803d"/>
  <text x="195.0" y="165.96" class="pill" text-anchor="middle" style="font-size:11px">OBSERVED</text>
  <rect x="50" y="196" width="290" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="195.0" y="221.55" class="t" text-anchor="middle" style="font-size:15px">1 VM</text>
  <text x="195.0" y="240.5" class="s" text-anchor="middle" style="font-size:12.5px">cold, point-in-time copy</text>
  <rect x="50" y="270" width="290" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="195.0" y="295.55" class="t" text-anchor="middle" style="font-size:15px">manual gates</text>
  <text x="195.0" y="314.5" class="s" text-anchor="middle" style="font-size:12.5px">I1 -&gt; I4, each approved</text>
  <rect x="50" y="344" width="290" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="195.0" y="369.55" class="t" text-anchor="middle" style="font-size:15px">1 node</text>
  <text x="195.0" y="388.5" class="s" text-anchor="middle" style="font-size:12.5px">kubeadm on one EC2</text>
  <rect x="50" y="418" width="290" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="195.0" y="443.55" class="t" text-anchor="middle" style="font-size:15px">RWO EBS</text>
  <text x="195.0" y="462.5" class="s" text-anchor="middle" style="font-size:12.5px">LiveMigratable=False</text>
  <rect x="50" y="492" width="290" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="195.0" y="517.55" class="t" text-anchor="middle" style="font-size:15px">lift-and-shift</text>
  <text x="195.0" y="536.5" class="s" text-anchor="middle" style="font-size:12.5px">nginx still inside a VM</text>
  <rect x="50" y="566" width="290" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="195.0" y="591.55" class="t" text-anchor="middle" style="font-size:15px">no controller</text>
  <text x="195.0" y="610.5" class="s" text-anchor="middle" style="font-size:12.5px">no CRD, no automation</text>
  <rect x="50" y="640" width="290" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="195.0" y="665.55" class="t" text-anchor="middle" style="font-size:15px">no metrics API</text>
  <text x="195.0" y="684.5" class="s" text-anchor="middle" style="font-size:12.5px">Headlamp read-only view</text>
  <rect x="390" y="126" width="375" height="180" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="577.5" y="192.78" class="t" text-anchor="middle" style="font-size:16.5px">MTV / Forklift warm migration</text>
  <text x="577.5" y="212.41" class="s" text-anchor="middle" style="font-size:13px">copy while the source keeps running,</text>
  <text x="577.5" y="231.41" class="s" text-anchor="middle" style="font-size:13px">then a short final cutover</text>
  <text x="577.5" y="250.41" class="s" text-anchor="middle" style="font-size:13px">(ADR 003: cold before warm)</text>
  <rect x="611" y="116" width="144" height="20" rx="10.0" fill="#64748b"/>
  <text x="683.0" y="129.96" class="pill" text-anchor="middle" style="font-size:11px">FUTURE / REFERENCE</text>
  <rect x="785" y="126" width="375" height="180" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="972.5" y="192.78" class="t" text-anchor="middle" style="font-size:16.5px">Migration controller</text>
  <text x="972.5" y="212.41" class="s" text-anchor="middle" style="font-size:13px">reconciles one migration request;</text>
  <text x="972.5" y="231.41" class="s" text-anchor="middle" style="font-size:13px">creates DataVolume + VirtualMachine</text>
  <text x="972.5" y="250.41" class="s" text-anchor="middle" style="font-size:13px">(ADR 005: controller vs scripts)</text>
  <rect x="1006" y="116" width="144" height="20" rx="10.0" fill="#64748b"/>
  <text x="1078.0" y="129.96" class="pill" text-anchor="middle" style="font-size:11px">FUTURE / REFERENCE</text>
  <rect x="390" y="330" width="375" height="180" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="577.5" y="396.78" class="t" text-anchor="middle" style="font-size:16.5px">VirtualMachineMigration CRD</text>
  <text x="577.5" y="416.41" class="s" text-anchor="middle" style="font-size:13px">the Stage 0 conceptual custom resource</text>
  <text x="577.5" y="435.41" class="s" text-anchor="middle" style="font-size:13px">status.phase state machine</text>
  <text x="577.5" y="454.41" class="s" text-anchor="middle" style="font-size:13px">designed on paper, not implemented</text>
  <rect x="611" y="320" width="144" height="20" rx="10.0" fill="#64748b"/>
  <text x="683.0" y="333.96" class="pill" text-anchor="middle" style="font-size:11px">FUTURE / REFERENCE</text>
  <rect x="785" y="330" width="375" height="180" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="972.5" y="396.78" class="t" text-anchor="middle" style="font-size:16.5px">Application modernization</text>
  <text x="972.5" y="416.41" class="s" text-anchor="middle" style="font-size:13px">move nginx out of the VM into a</text>
  <text x="972.5" y="435.41" class="s" text-anchor="middle" style="font-size:13px">container Deployment + Service</text>
  <text x="972.5" y="454.41" class="s" text-anchor="middle" style="font-size:13px">(removes the guest OS)</text>
  <rect x="1006" y="320" width="144" height="20" rx="10.0" fill="#64748b"/>
  <text x="1078.0" y="333.96" class="pill" text-anchor="middle" style="font-size:11px">FUTURE / REFERENCE</text>
  <rect x="390" y="534" width="375" height="180" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="577.5" y="600.78" class="t" text-anchor="middle" style="font-size:16.5px">Multi-node production KubeVirt</text>
  <text x="577.5" y="620.41" class="s" text-anchor="middle" style="font-size:13px">several nodes, HA control plane,</text>
  <text x="577.5" y="639.41" class="s" text-anchor="middle" style="font-size:13px">upgrades and node maintenance</text>
  <text x="577.5" y="658.41" class="s" text-anchor="middle" style="font-size:13px">with monitoring and metrics</text>
  <rect x="611" y="524" width="144" height="20" rx="10.0" fill="#64748b"/>
  <text x="683.0" y="537.96" class="pill" text-anchor="middle" style="font-size:11px">FUTURE / REFERENCE</text>
  <rect x="785" y="534" width="375" height="180" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="972.5" y="600.78" class="t" text-anchor="middle" style="font-size:16.5px">RWX storage for live migration</text>
  <text x="972.5" y="620.41" class="s" text-anchor="middle" style="font-size:13px">today RWO EBS: no live migration</text>
  <text x="972.5" y="639.41" class="s" text-anchor="middle" style="font-size:13px">shared RWX storage would let</text>
  <text x="972.5" y="658.41" class="s" text-anchor="middle" style="font-size:13px">KubeVirt move a running VM</text>
  <rect x="1006" y="524" width="144" height="20" rx="10.0" fill="#64748b"/>
  <text x="1078.0" y="537.96" class="pill" text-anchor="middle" style="font-size:11px">FUTURE / REFERENCE</text>
  <path d="M362,415 L386,415" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="2 5" marker-end="url(#m64748b)" stroke-linecap="round"/>
  <rect x="30" y="744" width="1140" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="600.0" y="776.8" class="t" text-anchor="middle" style="font-size:15px">Stage 1I proves the destination by hand. These items would automate, scale and harden it - later, if approved.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
  <title id="title">QEMU/KVM anatomy inside the virt-launcher Pod</title>
  <desc id="desc">Inside the EC2 node, the virt-launcher Pod network namespace has eth0 10.244.0.30/24, nftables DNAT of TCP 80 and 22 to 10.0.2.2, the bridge k6t-eth0 10.0.2.1/24 and tap0 feeding QEMU's virtio-net. The compute container runs virt-launcher-monitor, virt-launcher, virtqemud, virtlogd and qemu-kvm. QEMU provides 2 vCPU, 4 GiB, UEFI OVMF, q35, VirtIO block and net, the guest-agent channel, a memory balloon and an itco watchdog. Disk chain: PVC, EBS block device, /dev/rootdisk, libvirt block disk and QEMU host_device, guest vda, Ubuntu filesystems.</desc>

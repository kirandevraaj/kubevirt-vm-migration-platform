  <text x="220.0" y="493.5" class="s" text-anchor="middle" style="font-size:12.5px">the VM's cable: backs QEMU's virtio-net NIC</text>
  <rect x="64" y="540" width="312" height="108" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="78" y="570.73" class="t" text-anchor="start" style="font-size:14px">Why two subnets?</text>
  <text x="78" y="589.5" class="s" text-anchor="start" style="font-size:12.5px">10.244.0.30 = the Pod (Kubernetes side)</text>
  <text x="78" y="608.0" class="s" text-anchor="start" style="font-size:12.5px">10.0.2.0/24 = private, inside this Pod only</text>
  <text x="78" y="626.5" class="s" text-anchor="start" style="font-size:12.5px">masquerade NAT joins them</text>

  <text x="1041.5" y="97.96" class="pill" text-anchor="middle" style="font-size:11px">LIVE CHECK 10:46 UTC + OBSERVED I4</text>
  <rect x="30" y="110" width="1140" height="870" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
  <text x="48" y="134" class="lab" text-anchor="start" style="fill:#c2410c">EC2 NODE ip-10-40-1-10</text>
  <text x="250" y="134" class="xs" text-anchor="start" style="font-weight:600">CentOS Stream 9, kernel 5.14 - kvm_intel nested=Y - /dev/kvm - flannel veth</text>
  <rect x="46" y="148" width="1108" height="620" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="64" y="172" class="lab" text-anchor="start" style="fill:#1d4ed8">virt-launcher-legacy-source-vm-migrated-nqq8c</text>
  <text x="440" y="172" class="xs" text-anchor="start" style="font-weight:600">one Pod = one network namespace; 2/2 containers</text>
  <text x="70" y="202" class="lab" text-anchor="start" style="font-size:12px">POD NETWORK NAMESPACE</text>

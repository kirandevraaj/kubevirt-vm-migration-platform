  <text x="220.0" y="240.55" class="t" text-anchor="middle" style="font-size:15px">eth0   10.244.0.30/24</text>
  <text x="220.0" y="259.5" class="s" text-anchor="middle" style="font-size:12.5px">pod IP on flannel (veth to the node)</text>

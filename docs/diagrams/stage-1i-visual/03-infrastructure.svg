  <text x="938" y="707" class="xs halo" text-anchor="start" style="font-weight:600">attached</text>
  <text x="704" y="876" class="xs" text-anchor="start" style="font-weight:600">IAM instance profile: EBS CSI permissions only; no AWS keys on the node</text>

  <text x="608" y="786" class="xs halo" text-anchor="middle" style="font-weight:700">TCP 22 SFTP</text>
  <text x="608" y="802" class="xs halo" text-anchor="middle">(I4 only)</text>
  <path d="M556,520 L712,520" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-dasharray="9 6"/>
  <path d="M715,509 L737,531 M737,509 L715,531" stroke="#b91c1c" stroke-width="5" stroke-linecap="round"/>
  <text x="608" y="510" class="xs halo" text-anchor="middle" style="fill:#b91c1c;font-weight:700">TCP 6443</text>
  <text x="608" y="544" class="xs halo" text-anchor="middle" style="fill:#b91c1c">no SG rule</text>
</svg>

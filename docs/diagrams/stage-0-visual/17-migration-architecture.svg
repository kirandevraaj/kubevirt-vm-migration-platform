<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc">
  <title id="title">Migration architecture: the designed VMware to KubeVirt flow</title>
  <desc id="desc">The designed cold-migration flow in three rows. Source side: VMware source VM, discovery, inventory and assessment, disk acquisition. Conversion: qemu-img or virt-v2v, then staging through an S3 URL or the CDI upload proxy. Kubernetes target: CDI, DataVolume, PVC, KubeVirt VM, validation. Above all of it sits a future VirtualMachineMigration controller that would orchestrate every step. Nothing on this diagram was built in Stage 0.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="m475569" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="m64748b" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="990" fill="#ffffff"/>
  <text x="600.0" y="44" class="h" text-anchor="middle">Migration architecture</text>
  <text x="600.0" y="70" class="sub" text-anchor="middle">The cold-migration road designed in Stage 0, with the controller layer on top</text>
  <rect x="40" y="94" width="1120" height="84" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="3 4"/>
  <rect x="60" y="106" width="80" height="20" rx="10.0" fill="#475569"/>
  <text x="100.0" y="119.96" class="pill" text-anchor="middle" style="font-size:11px">NOT BUILT</text>
  <text x="600" y="132" class="t" text-anchor="middle" style="font-size:19px;fill:#334155">FUTURE LAYER: VirtualMachineMigration controller</text>
  <text x="600" y="160" class="s" text-anchor="middle" style="font-size:13.5px">one custom resource per migration; every step below becomes a reconciliation checkpoint (ADR 005)</text>
  <path d="M300,180 L300,216" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#m64748b)" stroke-linecap="round"/>
  <path d="M600,180 L600,216" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#m64748b)" stroke-linecap="round"/>
  <path d="M900,180 L900,216" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#m64748b)" stroke-linecap="round"/>
  <text x="912" y="204" class="xs" text-anchor="start" style="font-weight:600">would orchestrate every step</text>
  <rect x="40" y="220" width="1120" height="150" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="56" y="246" class="lab" text-anchor="start">SOURCE SIDE (LAB)</text>
  <rect x="40" y="410" width="1120" height="150" rx="14" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
  <text x="56" y="436" class="lab" text-anchor="start">CONVERSION</text>
  <rect x="40" y="600" width="1120" height="150" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="56" y="626" class="lab" text-anchor="start">KUBERNETES TARGET (AWS, DISPOSABLE)</text>
  <rect x="80" y="262" width="230" height="80" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="195.0" y="297.71" class="t" text-anchor="middle" style="font-size:15.5px">VMware source</text>
  <text x="195.0" y="316.75" class="s" text-anchor="middle" style="font-size:12.5px">ESXi VM running nginx</text>
  <rect x="350" y="262" width="230" height="80" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="465.0" y="297.71" class="t" text-anchor="middle" style="font-size:15.5px">Discovery</text>
  <text x="465.0" y="316.75" class="s" text-anchor="middle" style="font-size:12.5px">SSH + vim-cmd, read .vmx</text>
  <path d="M312,302 L347,302" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="620" y="262" width="230" height="80" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="735.0" y="297.71" class="t" text-anchor="middle" style="font-size:15.5px">Inventory + assessment</text>
  <text x="735.0" y="316.75" class="s" text-anchor="middle" style="font-size:12.5px">normalize facts, find blockers</text>
  <path d="M582,302 L617,302" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="890" y="262" width="230" height="80" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="1005.0" y="297.71" class="t" text-anchor="middle" style="font-size:15.5px">Disk acquisition</text>
  <text x="1005.0" y="316.75" class="s" text-anchor="middle" style="font-size:12.5px">power off, copy VMDK, checksum</text>
  <path d="M852,302 L887,302" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <path d="M1005,344 L1005,449" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="890" y="452" width="230" height="80" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="1005.0" y="478.46" class="t" text-anchor="middle" style="font-size:15.5px">Conversion</text>
  <text x="1005.0" y="497.5" class="s" text-anchor="middle" style="font-size:12.5px">qemu-img (format) or</text>
  <text x="1005.0" y="516.0" class="s" text-anchor="middle" style="font-size:12.5px">virt-v2v (whole guest)</text>
  <rect x="620" y="452" width="230" height="80" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="735.0" y="478.46" class="t" text-anchor="middle" style="font-size:15.5px">Staging</text>
  <text x="735.0" y="497.5" class="s" text-anchor="middle" style="font-size:12.5px">S3 URL or the</text>
  <text x="735.0" y="516.0" class="s" text-anchor="middle" style="font-size:12.5px">CDI upload proxy</text>
  <path d="M888,492 L853,492" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <text x="80" y="480.0" class="s" text-anchor="start" style="font-size:13.5px;fill:#334155">qemu-img changes only the disk format.</text>
  <text x="80" y="499.5" class="s" text-anchor="start" style="font-size:13.5px;fill:#334155">virt-v2v also fixes the guest for KVM:</text>
  <text x="80" y="519.0" class="s" text-anchor="start" style="font-size:13.5px;fill:#334155">virtio drivers, VMware Tools, bootloader.</text>
  <path d="M735,534 L735,580 L160,580 L160,639" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="65" y="642" width="190" height="80" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="160.0" y="677.71" class="t" text-anchor="middle" style="font-size:15.5px">CDI</text>
  <text x="160.0" y="696.75" class="s" text-anchor="middle" style="font-size:12.5px">importer / upload Pod</text>
  <rect x="285" y="642" width="190" height="80" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="380.0" y="677.71" class="t" text-anchor="middle" style="font-size:15.5px">DataVolume</text>
  <text x="380.0" y="696.75" class="s" text-anchor="middle" style="font-size:12.5px">phase + progress</text>
  <path d="M257,682 L282,682" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="505" y="642" width="190" height="80" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="600.0" y="677.71" class="t" text-anchor="middle" style="font-size:15.5px">PVC</text>
  <text x="600.0" y="696.75" class="s" text-anchor="middle" style="font-size:12.5px">raw bootable disk</text>
  <path d="M477,682 L502,682" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="725" y="642" width="190" height="80" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="820.0" y="677.71" class="t" text-anchor="middle" style="font-size:15.5px">KubeVirt VM</text>
  <text x="820.0" y="696.75" class="s" text-anchor="middle" style="font-size:12.5px">spec from inventory</text>
  <path d="M697,682 L722,682" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="945" y="642" width="190" height="80" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="1040.0" y="677.71" class="t" text-anchor="middle" style="font-size:15.5px">Validation</text>
  <text x="1040.0" y="696.75" class="s" text-anchor="middle" style="font-size:12.5px">VMI Running + HTTP 200</text>
  <path d="M917,682 L942,682" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <text x="600" y="786" class="s" text-anchor="middle" style="font-size:14px;fill:#334155;font-weight:600">Stage 1 later walked the source and conversion rows by hand.</text>
  <text x="600" y="808" class="s" text-anchor="middle" style="font-size:14px;fill:#334155;font-weight:600">The Kubernetes row and the controller are still not built.</text>
  <rect x="30" y="836" width="1140" height="56" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="600.0" y="872" class="t" text-anchor="middle" style="font-size:20px;fill:#0f172a">Stage 0 designed the whole road. Nothing on this diagram was built in Stage 0.</text>
  <rect x="343.5" y="926" width="34" height="20" rx="5" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <rect x="385.5" y="926" width="115" height="20" rx="10.0" fill="#a16207"/>
  <text x="443.0" y="939.96" class="pill" text-anchor="middle" style="font-size:11px">STAGE 0 DESIGN</text>
  <text x="508.5" y="941" class="xs" text-anchor="start">on paper, not built</text>
  <rect x="656.1" y="926" width="34" height="20" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <rect x="698.1" y="926" width="80" height="20" rx="10.0" fill="#475569"/>
  <text x="738.1" y="939.96" class="pill" text-anchor="middle" style="font-size:11px">NOT BUILT</text>
  <text x="786.1" y="941" class="xs" text-anchor="start">future work</text>
</svg>

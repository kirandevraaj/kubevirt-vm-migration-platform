<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Spec, status and conditions</title>
  <desc id="desc">The user writes spec, what I want. The controller acts. The controller writes status, what actually happened. Spec is not status. Conditions are typed facts with a status and reason, such as SourceDiscovered, Validated, DiskConverted, DiskImported, VMCreated, VMStarted, GuestReady and Ready, as designed for the VirtualMachineMigration resource in Stage 0.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="m475569" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="600.0" y="44" class="h" text-anchor="middle">Spec, status and conditions</text>
  <text x="600.0" y="70" class="sub" text-anchor="middle">Why every Kubernetes object has two halves</text>
  <rect x="60" y="104" width="300" height="120" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="210.0" y="151.32" class="t" text-anchor="middle" style="font-size:26px">SPEC</text>
  <text x="210.0" y="174.3" class="s" text-anchor="middle" style="font-size:15px">"what I want"</text>
  <text x="210.0" y="195.3" class="s" text-anchor="middle" style="font-size:15px">written by the user</text>
  <rect x="450" y="104" width="300" height="120" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="600.0" y="150.68" class="t" text-anchor="middle" style="font-size:24px">CONTROLLER</text>
  <text x="600.0" y="173.3" class="s" text-anchor="middle" style="font-size:15px">reads spec, observes reality,</text>
  <text x="600.0" y="194.3" class="s" text-anchor="middle" style="font-size:15px">acts, then reports</text>
  <rect x="840" y="104" width="300" height="120" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="990.0" y="151.32" class="t" text-anchor="middle" style="font-size:26px">STATUS</text>
  <text x="990.0" y="174.3" class="s" text-anchor="middle" style="font-size:15px">"what actually happened"</text>
  <text x="990.0" y="195.3" class="s" text-anchor="middle" style="font-size:15px">written only by the controller</text>
  <path d="M362,164 L447,164" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#m475569)"/>
  <path d="M752,164 L837,164" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#m475569)"/>
  <text x="600" y="292" class="t" text-anchor="middle" style="font-size:34px">spec  &#8800;  status</text>
  <text x="600" y="322" class="s" text-anchor="middle" style="font-size:14px">desired state and observed state are kept apart</text>
  <text x="60" y="368" class="lab" text-anchor="start">CONDITIONS DESIGNED FOR THE MIGRATION CR</text>
  <rect x="470" y="355" width="115" height="20" rx="10.0" fill="#a16207"/>
  <text x="527.5" y="368.96" class="pill" text-anchor="middle" style="font-size:11px">STAGE 0 DESIGN</text>
  <rect x="60" y="386" width="640" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="76" y="409" class="t" text-anchor="start" style="font-size:14.5px">SourceDiscovered</text>
  <text x="270" y="409" class="s" text-anchor="start" style="font-size:13.5px">inventory read successfully</text>
  <rect x="60" y="426" width="640" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="76" y="449" class="t" text-anchor="start" style="font-size:14.5px">Validated</text>
  <text x="270" y="449" class="s" text-anchor="start" style="font-size:13.5px">pre-flight checks passed</text>
  <rect x="60" y="466" width="640" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="76" y="489" class="t" text-anchor="start" style="font-size:14.5px">DiskConverted</text>
  <text x="270" y="489" class="s" text-anchor="start" style="font-size:13.5px">converted image + checksum recorded</text>
  <rect x="60" y="506" width="640" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="76" y="529" class="t" text-anchor="start" style="font-size:14.5px">DiskImported</text>
  <text x="270" y="529" class="s" text-anchor="start" style="font-size:13.5px">DataVolume Succeeded</text>
  <rect x="60" y="546" width="640" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="76" y="569" class="t" text-anchor="start" style="font-size:14.5px">VMCreated</text>
  <text x="270" y="569" class="s" text-anchor="start" style="font-size:13.5px">VirtualMachine exists</text>
  <rect x="60" y="586" width="640" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="76" y="609" class="t" text-anchor="start" style="font-size:14.5px">VMStarted</text>
  <text x="270" y="609" class="s" text-anchor="start" style="font-size:13.5px">VMI observed Running</text>
  <rect x="60" y="626" width="640" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="76" y="649" class="t" text-anchor="start" style="font-size:14.5px">GuestReady</text>
  <text x="270" y="649" class="s" text-anchor="start" style="font-size:13.5px">guest booted, validation passed</text>
  <rect x="60" y="666" width="640" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="76" y="689" class="t" text-anchor="start" style="font-size:14.5px">Ready</text>
  <text x="270" y="689" class="s" text-anchor="start" style="font-size:13.5px">whole migration done</text>
  <text x="60" y="732" class="xs" text-anchor="start">each has: status (True / False), reason, message, lastTransitionTime, observedGeneration</text>
  <rect x="740" y="356" width="400" height="386" rx="12" fill="#0f172a" stroke="#0f172a" stroke-width="1.6"/>
  <text x="762" y="388" xml:space="preserve" style="font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#e2e8f0">status:</text>
  <text x="762" y="416" xml:space="preserve" style="font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#e2e8f0">  phase: Importing</text>
  <text x="762" y="444" xml:space="preserve" style="font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#e2e8f0">  observedGeneration: 1</text>
  <text x="762" y="472" xml:space="preserve" style="font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#e2e8f0">  conditions:</text>
  <text x="762" y="500" xml:space="preserve" style="font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#e2e8f0">  - type: SourceDiscovered</text>
  <text x="762" y="528" xml:space="preserve" style="font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#e2e8f0">    status: &quot;True&quot;</text>
  <text x="762" y="556" xml:space="preserve" style="font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#e2e8f0">    reason: InventoryRead</text>
  <text x="762" y="584" xml:space="preserve" style="font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#e2e8f0">  - type: DiskImported</text>
  <text x="762" y="612" xml:space="preserve" style="font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#e2e8f0">    status: &quot;False&quot;</text>
  <text x="762" y="640" xml:space="preserve" style="font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#e2e8f0">    reason: ImportInProgress</text>
  <text x="762" y="668" xml:space="preserve" style="font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#e2e8f0">    message: &quot;... at 42%&quot;</text>
  <text x="762" y="696" xml:space="preserve" style="font-family:Consolas,'Courier New',monospace;font-size:14px;fill:#94a3b8">  # example from the design, not a real run</text>
  <rect x="30" y="764" width="1140" height="74" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="600.0" y="796" class="t" text-anchor="middle" style="font-size:20px;fill:#0f172a">The controller reports what it knows.</text>
  <text x="600.0" y="820" class="s" text-anchor="middle" style="font-size:14px;fill:#334155">status.phase is the current reconciliation checkpoint, not a history log.</text>
  <rect x="170.09999999999997" y="860" width="34" height="20" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <rect x="212.09999999999997" y="860" width="80" height="20" rx="10.0" fill="#1d4ed8"/>
  <text x="252.09999999999997" y="873.96" class="pill" text-anchor="middle" style="font-size:11px">COMPONENT</text>
  <text x="300.09999999999997" y="875" class="xs" text-anchor="start">technology (documented)</text>
  <rect x="473.3" y="860" width="34" height="20" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <rect x="515.3" y="860" width="66" height="20" rx="10.0" fill="#6d28d9"/>
  <text x="548.3" y="873.96" class="pill" text-anchor="middle" style="font-size:11px">CONCEPT</text>
  <text x="589.3" y="875" class="xs" text-anchor="start">control logic / idea</text>
  <rect x="743.3" y="860" width="34" height="20" rx="5" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <rect x="785.3" y="860" width="115" height="20" rx="10.0" fill="#a16207"/>
  <text x="842.8" y="873.96" class="pill" text-anchor="middle" style="font-size:11px">STAGE 0 DESIGN</text>
  <text x="908.3" y="875" class="xs" text-anchor="start">on paper, not built</text>
</svg>

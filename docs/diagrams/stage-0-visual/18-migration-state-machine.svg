<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">Migration state machine</title>
  <desc id="desc">The designed status.phase values of the VirtualMachineMigration resource: Pending, Discovering, Validated, Preparing, Converting, Importing, CreatingVM, Starting, Validating and Completed. Any active phase can go to Retryable, which resumes the same phase with backoff, to ManualInterventionRequired, which waits for a human, or to Failed, which is terminal. Rollback is not a phase: the source VM is powered back on and its disk is never modified.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="m475569" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="mb45309" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="mb91c1c" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
  <rect width="1200" height="960" fill="#ffffff"/>
  <text x="600.0" y="44" class="h" text-anchor="middle">Migration state machine</text>
  <text x="600.0" y="70" class="sub" text-anchor="middle">Designed status.phase values for the VirtualMachineMigration resource</text>
  <rect x="30" y="96" width="1140" height="340" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="122" class="lab" text-anchor="start">PHASES</text>
  <text x="46" y="142" class="xs" text-anchor="start">advance only on OBSERVED success</text>
  <rect x="60" y="160" width="190" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="155.0" y="190.87" class="t" text-anchor="middle" style="font-size:16px">Pending</text>
  <text x="155.0" y="210.0" class="s" text-anchor="middle" style="font-size:12.5px">finalizer added</text>
  <rect x="280" y="160" width="190" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="375.0" y="190.87" class="t" text-anchor="middle" style="font-size:16px">Discovering</text>
  <text x="375.0" y="210.0" class="s" text-anchor="middle" style="font-size:12.5px">inventory read (read-only)</text>
  <path d="M252,195 L277,195" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="500" y="160" width="190" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="595.0" y="190.87" class="t" text-anchor="middle" style="font-size:16px">Validated</text>
  <text x="595.0" y="210.0" class="s" text-anchor="middle" style="font-size:12.5px">pre-flight checks</text>
  <path d="M472,195 L497,195" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="720" y="160" width="190" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="815.0" y="190.87" class="t" text-anchor="middle" style="font-size:16px">Preparing</text>
  <text x="815.0" y="210.0" class="s" text-anchor="middle" style="font-size:12.5px">power off, copy VMDK</text>
  <rect x="756" y="150" width="144" height="20" rx="10.0" fill="#b91c1c"/>
  <text x="828.0" y="163.96" class="pill" text-anchor="middle" style="font-size:11px">IRREVERSIBLE GUARD</text>
  <path d="M692,195 L717,195" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="940" y="160" width="190" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="1035.0" y="190.87" class="t" text-anchor="middle" style="font-size:16px">Converting</text>
  <text x="1035.0" y="210.0" class="s" text-anchor="middle" style="font-size:12.5px">convert + stage image</text>
  <path d="M912,195 L937,195" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <path d="M1035,232 L1035,327" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="940" y="330" width="190" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="1035.0" y="360.87" class="t" text-anchor="middle" style="font-size:16px">Importing</text>
  <text x="1035.0" y="380.0" class="s" text-anchor="middle" style="font-size:12.5px">DataVolume Succeeded</text>
  <rect x="720" y="330" width="190" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="815.0" y="360.87" class="t" text-anchor="middle" style="font-size:16px">CreatingVM</text>
  <text x="815.0" y="380.0" class="s" text-anchor="middle" style="font-size:12.5px">VM exists (Halted)</text>
  <path d="M938,365 L913,365" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="500" y="330" width="190" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="595.0" y="360.87" class="t" text-anchor="middle" style="font-size:16px">Starting</text>
  <text x="595.0" y="380.0" class="s" text-anchor="middle" style="font-size:12.5px">VMI Running</text>
  <path d="M718,365 L693,365" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="280" y="330" width="190" height="70" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="375.0" y="360.87" class="t" text-anchor="middle" style="font-size:16px">Validating</text>
  <text x="375.0" y="380.0" class="s" text-anchor="middle" style="font-size:12.5px">app checks pass</text>
  <path d="M498,365 L473,365" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="60" y="330" width="190" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="155.0" y="360.87" class="t" text-anchor="middle" style="font-size:16px">Completed</text>
  <text x="155.0" y="380.0" class="s" text-anchor="middle" style="font-size:12.5px">Ready=True, clean staging</text>
  <rect x="103" y="320" width="137" height="20" rx="10.0" fill="#15803d"/>
  <text x="171.5" y="333.96" class="pill" text-anchor="middle" style="font-size:11px">TERMINAL: SUCCESS</text>
  <path d="M278,365 L253,365" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="60" y="520" width="330" height="90" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="225.0" y="551.28" class="t" text-anchor="middle" style="font-size:16.5px">Retryable</text>
  <text x="225.0" y="570.91" class="s" text-anchor="middle" style="font-size:13px">wait with backoff, then resume</text>
  <text x="225.0" y="589.91" class="s" text-anchor="middle" style="font-size:13px">the SAME phase (retryLimit)</text>
  <rect x="300" y="510" width="80" height="20" rx="10.0" fill="#b45309"/>
  <text x="340.0" y="523.96" class="pill" text-anchor="middle" style="font-size:11px">RETRYABLE</text>
  <path d="M260,438 L260,517" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <text x="272" y="482" class="xs halo" text-anchor="start" style="font-weight:600">transient error</text>
  <rect x="435" y="520" width="330" height="90" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="600.0" y="551.28" class="t" text-anchor="middle" style="font-size:16.5px">ManualInterventionRequired</text>
  <text x="600.0" y="570.91" class="s" text-anchor="middle" style="font-size:13px">record reason, emit Event;</text>
  <text x="600.0" y="589.91" class="s" text-anchor="middle" style="font-size:13px">a human fixes spec or annotates</text>
  <rect x="647" y="510" width="108" height="20" rx="10.0" fill="#334155"/>
  <text x="701.0" y="523.96" class="pill" text-anchor="middle" style="font-size:11px">NEEDS A HUMAN</text>
  <path d="M635,438 L635,517" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <text x="647" y="482" class="xs halo" text-anchor="start" style="font-weight:600">human decision needed</text>
  <rect x="810" y="520" width="330" height="90" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="975.0" y="551.28" class="t" text-anchor="middle" style="font-size:16.5px">Failed</text>
  <text x="975.0" y="570.91" class="s" text-anchor="middle" style="font-size:13px">permanent error or retries exhausted;</text>
  <text x="975.0" y="589.91" class="s" text-anchor="middle" style="font-size:13px">never touches the source disk</text>
  <rect x="1057" y="510" width="73" height="20" rx="10.0" fill="#334155"/>
  <text x="1093.5" y="523.96" class="pill" text-anchor="middle" style="font-size:11px">TERMINAL</text>
  <path d="M1010,438 L1010,517" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <text x="1022" y="482" class="xs halo" text-anchor="start" style="font-weight:600">permanent error</text>
  <path d="M110,518 L110,438" fill="none" stroke="#b45309" stroke-width="2.2" stroke-dasharray="9 6" marker-end="url(#mb45309)"/>
  <text x="122" y="482" class="xs halo" text-anchor="start" style="font-weight:600">retry</text>
  <path d="M225,612 L225,640 L975,640 L975,614" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="9 6" marker-end="url(#mb91c1c)"/>
  <text x="600" y="634" class="xs halo" text-anchor="middle" style="font-weight:600">retry budget exhausted</text>
  <rect x="60" y="672" width="520" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="320.0" y="703.28" class="t" text-anchor="middle" style="font-size:16.5px">Rollback is not a phase</text>
  <text x="320.0" y="722.91" class="s" text-anchor="middle" style="font-size:13px">power the source VM back on: its disk is never modified;</text>
  <text x="320.0" y="741.91" class="s" text-anchor="middle" style="font-size:13px">deleting the CR (finalizer) removes destination objects</text>
  <rect x="620" y="672" width="520" height="90" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="880.0" y="703.28" class="t" text-anchor="middle" style="font-size:16.5px">The irreversible step is guarded</text>
  <text x="880.0" y="722.91" class="s" text-anchor="middle" style="font-size:13px">source power-off happens only after Validated=True,</text>
  <text x="880.0" y="741.91" class="s" text-anchor="middle" style="font-size:13px">per powerOffPolicy, recorded once with a timestamp</text>
  <rect x="30" y="790" width="1140" height="74" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="600.0" y="822" class="t" text-anchor="middle" style="font-size:20px;fill:#0f172a">State machine = reconciliation checkpoints</text>
  <text x="600.0" y="846" class="s" text-anchor="middle" style="font-size:14px;fill:#334155">Each arrow is taken only after the controller observes the goal, not merely after it issues a command.</text>
  <rect x="112.19999999999999" y="900" width="34" height="20" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <rect x="154.2" y="900" width="52" height="20" rx="10.0" fill="#6d28d9"/>
  <text x="180.2" y="913.96" class="pill" text-anchor="middle" style="font-size:11px">PHASE</text>
  <text x="214.2" y="915" class="xs" text-anchor="start">designed checkpoint</text>
  <rect x="361.8" y="900" width="34" height="20" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <rect x="403.8" y="900" width="108" height="20" rx="10.0" fill="#b45309"/>
  <text x="457.8" y="913.96" class="pill" text-anchor="middle" style="font-size:11px">RETRY / GUARD</text>
  <text x="519.8" y="915" class="xs" text-anchor="start">caution</text>
  <rect x="590.6" y="900" width="34" height="20" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <rect x="632.6" y="900" width="66" height="20" rx="10.0" fill="#b91c1c"/>
  <text x="665.6" y="913.96" class="pill" text-anchor="middle" style="font-size:11px">FAILURE</text>
  <text x="706.6" y="915" class="xs" text-anchor="start">human or terminal</text>
  <rect x="841.4000000000001" y="900" width="34" height="20" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <rect x="883.4000000000001" y="900" width="94" height="20" rx="10.0" fill="#475569"/>
  <text x="930.4000000000001" y="913.96" class="pill" text-anchor="middle" style="font-size:11px">NOT A PHASE</text>
  <text x="985.4000000000001" y="915" class="xs" text-anchor="start">explanatory note</text>
</svg>

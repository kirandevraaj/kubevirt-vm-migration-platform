  <rect x="710" y="160" width="300" height="52" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="860.0" y="181.8" class="t" text-anchor="middle" style="font-size:15px">Kubernetes</text>
  <text x="860.0" y="200.34" class="s" text-anchor="middle" style="font-size:12px">API, scheduler, storage, network</text>
  <rect x="710" y="234" width="300" height="52" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="860.0" y="255.8" class="t" text-anchor="middle" style="font-size:15px">KubeVirt</text>
  <text x="860.0" y="274.34" class="s" text-anchor="middle" style="font-size:12px">add-on: CRDs + controllers</text>
  <path d="M860,214 L860,231" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="710" y="308" width="300" height="52" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="860.0" y="329.8" class="t" text-anchor="middle" style="font-size:15px">VirtualMachine</text>
  <text x="860.0" y="348.34" class="s" text-anchor="middle" style="font-size:12px">persistent desired state</text>
  <path d="M860,288 L860,305" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="710" y="382" width="300" height="52" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="860.0" y="403.8" class="t" text-anchor="middle" style="font-size:15px">VMI</text>
  <text x="860.0" y="422.34" class="s" text-anchor="middle" style="font-size:12px">one running instance</text>
  <path d="M860,362 L860,379" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="710" y="456" width="300" height="52" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="860.0" y="477.8" class="t" text-anchor="middle" style="font-size:15px">virt-launcher Pod</text>
  <text x="860.0" y="496.34" class="s" text-anchor="middle" style="font-size:12px">a normal Pod per running VM</text>
  <path d="M860,436 L860,453" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="710" y="530" width="300" height="52" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>

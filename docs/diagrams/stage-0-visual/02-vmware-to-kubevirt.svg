  <text x="284" y="410.5" class="s" text-anchor="start" style="font-size:12.5px;fill:#334155">PVSCSI disk controller</text>
  <text x="284" y="429.0" class="s" text-anchor="start" style="font-size:12.5px;fill:#334155">VMXNET3 NIC</text>
  <rect x="120" y="678" width="300" height="52" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="270.0" y="699.8" class="t" text-anchor="middle" style="font-size:15px">Ubuntu</text>
  <text x="270.0" y="718.34" class="s" text-anchor="middle" style="font-size:12px">guest OS + kernel</text>
  <rect x="120" y="752" width="300" height="52" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="270.0" y="773.8" class="t" text-anchor="middle" style="font-size:15px">nginx</text>
  <text x="270.0" y="792.34" class="s" text-anchor="middle" style="font-size:12px">the application</text>

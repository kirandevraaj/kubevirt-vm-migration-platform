<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
  <title id="title">VirtualMachine versus VirtualMachineInstance</title>
  <desc id="desc">The VirtualMachine is the persistent, desired VM definition: a specification that exists even when the VM is stopped. The VirtualMachineInstance is one running instance, created by virt-controller when the VM should run and deleted when it stops. A timeline shows the VM existing throughout while the VMI and the running guest exist only between start and stop.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="m475569" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="930" fill="#ffffff"/>
  <text x="600.0" y="44" class="h" text-anchor="middle">VM vs VMI</text>
  <text x="600.0" y="70" class="sub" text-anchor="middle">The specification versus the running instance</text>
  <rect x="60" y="100" width="480" height="360" rx="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="300" y="142" class="t" text-anchor="middle" style="font-size:24px;fill:#5b21b6">VirtualMachine (VM)</text>
  <text x="300" y="176" class="s" text-anchor="middle" style="font-size:17px">"desired VM definition"</text>
  <rect x="229.0" y="192" width="142" height="22" rx="11.0" fill="#6d28d9"/>
  <text x="300.0" y="207.68" class="pill" text-anchor="middle" style="font-size:13px">= SPECIFICATION</text>
  <text x="90" y="256" class="s" text-anchor="start" style="font-size:15px;fill:#334155">persistent: exists while the VM is stopped</text>
  <text x="90" y="286" class="s" text-anchor="start" style="font-size:15px;fill:#334155">holds spec.template + spec.runStrategy</text>
  <text x="90" y="316" class="s" text-anchor="start" style="font-size:15px;fill:#334155">created by you, GitOps or a controller</text>
  <text x="90" y="346" class="s" text-anchor="start" style="font-size:15px;fill:#334155">status.printableStatus: Stopped, Running, ...</text>
  <text x="90" y="400" class="s" text-anchor="start" style="font-size:14px;fill:#5b21b6;font-weight:600">like a StatefulSet with replicas: 1,</text>
  <text x="90" y="420" class="s" text-anchor="start" style="font-size:14px;fill:#5b21b6;font-weight:600">or the VM in vCenter inventory</text>
  <rect x="660" y="100" width="480" height="360" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="900" y="142" class="t" text-anchor="middle" style="font-size:24px;fill:#1d4ed8">VirtualMachineInstance (VMI)</text>
  <text x="900" y="176" class="s" text-anchor="middle" style="font-size:17px">"running instance"</text>
  <rect x="816.5" y="192" width="167" height="22" rx="11.0" fill="#1d4ed8"/>
  <text x="900.0" y="207.68" class="pill" text-anchor="middle" style="font-size:13px">= RUNTIME INSTANCE</text>
  <text x="690" y="256" class="s" text-anchor="start" style="font-size:15px;fill:#334155">ephemeral: created at start, deleted at stop</text>
  <text x="690" y="286" class="s" text-anchor="start" style="font-size:15px;fill:#334155">holds the concrete running spec + live status</text>
  <text x="690" y="316" class="s" text-anchor="start" style="font-size:15px;fill:#334155">created by virt-controller from the template</text>
  <text x="690" y="346" class="s" text-anchor="start" style="font-size:15px;fill:#334155">status.phase: Pending, Scheduling, Running, ...</text>
  <text x="690" y="400" class="s" text-anchor="start" style="font-size:14px;fill:#1d4ed8;font-weight:600">like a Pod,</text>
  <text x="690" y="420" class="s" text-anchor="start" style="font-size:14px;fill:#1d4ed8;font-weight:600">or the VM while it is powered on</text>
  <path d="M544,280 L656,280" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#m475569)"/>
  <text x="600" y="250" class="s" text-anchor="middle" style="font-size:13px;fill:#334155;font-weight:700">creates</text>
  <text x="600" y="312" class="s" text-anchor="middle" style="font-size:12px;fill:#334155">when</text>
  <text x="600" y="330" class="s" text-anchor="middle" style="font-size:12px;fill:#334155">runStrategy</text>
  <text x="600" y="348" class="s" text-anchor="middle" style="font-size:12px;fill:#334155">says run</text>
  <text x="600" y="510" class="lab" text-anchor="middle">WHEN DOES EACH ONE EXIST?</text>
  <path d="M470,528 L470,770" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="470" y="790" class="xs" text-anchor="middle" style="font-weight:700">start: runStrategy Always</text>
  <path d="M900,528 L900,770" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="900" y="790" class="xs" text-anchor="middle" style="font-weight:700">stop: runStrategy Halted</text>
  <text x="60" y="580" class="t" text-anchor="start" style="font-size:16px">VirtualMachine</text>
  <rect x="250" y="560" width="870" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="250" y="556" width="870" height="44" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.2"/>
  <text x="685.0" y="584" class="s" text-anchor="middle" style="font-size:13.5px;font-weight:600">exists the whole time (Stopped - Running - Stopped)</text>
  <text x="60" y="660" class="t" text-anchor="start" style="font-size:16px">VMI</text>
  <rect x="250" y="640" width="870" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="470" y="636" width="430" height="44" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="685.0" y="664" class="s" text-anchor="middle" style="font-size:13.5px;font-weight:600">exists only while running</text>
  <text x="60" y="740" class="t" text-anchor="start" style="font-size:16px">running guest</text>
  <rect x="250" y="720" width="870" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="470" y="716" width="430" height="44" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2.2"/>
  <text x="685.0" y="744" class="s" text-anchor="middle" style="font-size:13.5px;font-weight:600">QEMU in the virt-launcher Pod</text>
  <rect x="30" y="820" width="1140" height="74" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="600.0" y="852" class="t" text-anchor="middle" style="font-size:20px;fill:#0f172a">A migration always creates a VirtualMachine: a migrated server must survive restarts.</text>
  <text x="600.0" y="876" class="s" text-anchor="middle" style="font-size:14px;fill:#334155">A bare VMI can be created too, but nothing restarts it when it stops.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
  <title id="title">Networking model: VMware versus KubeVirt</title>
  <desc id="desc">On VMware a guest NIC is a VMXNET3 vNIC on a port group of a vSwitch with physical uplinks. On KubeVirt the guest gets a virtio NIC; a binding connects it to a network. The Stage 0 plan is the pod network with masquerade binding, reached through a Kubernetes Service. Bridge binding and a Multus secondary network are shown smaller because they are optional and deferred.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="m475569" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="m94a3b8" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect width="1200" height="1010" fill="#ffffff"/>
  <text x="600.0" y="44" class="h" text-anchor="middle">Networking model</text>
  <text x="600.0" y="70" class="sub" text-anchor="middle">Where a NIC connects, and how it is wired</text>
  <rect x="30" y="96" width="440" height="740" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="122" class="lab" text-anchor="start">VMWARE</text>
  <text x="46" y="142" class="xs" text-anchor="start">ESXi</text>
  <rect x="520" y="96" width="650" height="740" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="536" y="122" class="lab" text-anchor="start">KUBEVIRT</text>
  <text x="536" y="142" class="xs" text-anchor="start">Kubernetes node + virt-launcher Pod</text>
  <rect x="90" y="170" width="320" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="250.0" y="200.87" class="t" text-anchor="middle" style="font-size:16px">Guest OS</text>
  <text x="250.0" y="220.0" class="s" text-anchor="middle" style="font-size:12.5px">Linux + nginx</text>
  <rect x="90" y="290" width="320" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="250.0" y="320.87" class="t" text-anchor="middle" style="font-size:16px">vNIC</text>
  <text x="250.0" y="340.0" class="s" text-anchor="middle" style="font-size:12.5px">VMXNET3, with a MAC</text>
  <rect x="90" y="430" width="320" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="250.0" y="460.87" class="t" text-anchor="middle" style="font-size:16px">Port group</text>
  <text x="250.0" y="480.0" class="s" text-anchor="middle" style="font-size:12.5px">named network + VLAN + policy</text>
  <rect x="90" y="580" width="320" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="250.0" y="610.87" class="t" text-anchor="middle" style="font-size:16px">vSwitch</text>
  <text x="250.0" y="630.0" class="s" text-anchor="middle" style="font-size:12.5px">L2 switch in the VMkernel</text>
  <rect x="90" y="730" width="320" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="250.0" y="760.87" class="t" text-anchor="middle" style="font-size:16px">Physical uplink</text>
  <text x="250.0" y="780.0" class="s" text-anchor="middle" style="font-size:12.5px">the datacenter network</text>
  <path d="M250,242 L250,287" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <path d="M250,362 L250,427" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <path d="M250,502 L250,577" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <path d="M250,652 L250,727" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="640" y="170" width="420" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="850.0" y="200.87" class="t" text-anchor="middle" style="font-size:16px">Guest OS</text>
  <text x="850.0" y="220.0" class="s" text-anchor="middle" style="font-size:12.5px">the same Linux + nginx</text>
  <rect x="640" y="290" width="420" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="850.0" y="320.87" class="t" text-anchor="middle" style="font-size:16px">virtio NIC</text>
  <text x="850.0" y="340.0" class="s" text-anchor="middle" style="font-size:12.5px">interfaces[]: model virtio, optional MAC</text>
  <path d="M850,242 L850,287" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="560" y="400" width="350" height="120" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3.5"/>
  <rect x="580" y="390" width="101" height="20" rx="10.0" fill="#334155"/>
  <text x="630.5" y="403.96" class="pill" text-anchor="middle" style="font-size:11px">STAGE 0 PLAN</text>
  <text x="735" y="444" class="t" text-anchor="middle" style="font-size:19px">masquerade binding</text>
  <text x="735" y="470" class="s" text-anchor="middle" style="font-size:13px;fill:#334155">guest gets a private DHCP address;</text>
  <text x="735" y="489" class="s" text-anchor="middle" style="font-size:13px;fill:#334155">NAT to the pod IP</text>
  <rect x="940" y="410" width="200" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="1040.0" y="441.48" class="t" text-anchor="middle" style="font-size:14px">bridge binding</text>
  <text x="1040.0" y="459.84" class="s" text-anchor="middle" style="font-size:12px">guest takes an L2 port</text>
  <text x="1040.0" y="477.84" class="s" text-anchor="middle" style="font-size:12px">(or the pod IP)</text>
  <path d="M760,362 L735,397" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <path d="M940,362 L1030,407" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="9 6" marker-end="url(#m94a3b8)"/>
  <rect x="560" y="560" width="350" height="110" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3.5"/>
  <text x="735" y="600" class="t" text-anchor="middle" style="font-size:19px">Pod network (eth0)</text>
  <text x="735" y="626" class="s" text-anchor="middle" style="font-size:13px;fill:#334155">networks[]: pod: {}</text>
  <text x="735" y="645" class="s" text-anchor="middle" style="font-size:13px;fill:#334155">one IP per Pod, L3-routed</text>
  <rect x="940" y="565" width="200" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="1040.0" y="601.48" class="t" text-anchor="middle" style="font-size:14px">Multus secondary</text>
  <text x="1040.0" y="619.84" class="s" text-anchor="middle" style="font-size:12px">net1 via a NAD</text>
  <text x="1040.0" y="637.84" class="s" text-anchor="middle" style="font-size:12px">(bridge / macvlan)</text>
  <rect x="1057" y="555" width="73" height="20" rx="10.0" fill="#475569"/>
  <text x="1093.5" y="568.96" class="pill" text-anchor="middle" style="font-size:11px">DEFERRED</text>
  <path d="M735,522 L735,557" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#m475569)"/>
  <path d="M1040,502 L1040,562" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="9 6" marker-end="url(#m94a3b8)"/>
  <rect x="560" y="720" width="580" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="850.0" y="750.87" class="t" text-anchor="middle" style="font-size:16px">Node CNI dataplane</text>
  <text x="850.0" y="770.0" class="s" text-anchor="middle" style="font-size:12.5px">e.g. Amazon VPC CNI, then the cluster / VPC network</text>
  <path d="M735,672 L735,717" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#m475569)"/>
  <path d="M1040,667 L1040,717" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="9 6" marker-end="url(#m94a3b8)"/>
  <text x="495" y="333" class="t" text-anchor="middle" style="font-size:22px;fill:#b45309">&#8776;</text>
  <text x="495" y="473" class="t" text-anchor="middle" style="font-size:22px;fill:#b45309">&#8776;</text>
  <text x="495" y="623" class="t" text-anchor="middle" style="font-size:22px;fill:#b45309">&#8776;</text>
  <text x="80" y="870" class="s" text-anchor="start" style="font-size:14px;fill:#92400e;font-weight:600">ROUGH ANALOGY:  vNIC &#8776; virtio NIC   |   port group &#8776; networks[] entry   |   vSwitch &#8776; CNI dataplane + in-pod plumbing</text>
  <rect x="30" y="900" width="1140" height="74" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="600.0" y="932" class="t" text-anchor="middle" style="font-size:20px;fill:#0f172a">networks[] says WHERE a NIC connects. interfaces[] says HOW (the binding).</text>
  <text x="600.0" y="956" class="s" text-anchor="middle" style="font-size:14px;fill:#334155">Our demo: one NIC, pod network, masquerade, guest on DHCP, exposed through a Kubernetes Service. No Multus.</text>
</svg>

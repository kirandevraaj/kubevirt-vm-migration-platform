<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">Network mapping from VMware to KubeVirt</title>
  <desc id="desc">A VMware NIC on a port group, with a VMXNET3 model, a MAC address and a static IP, must be mapped to a KubeVirt destination by answering five questions: destination network, binding, IP addressing, MAC address and guest OS configuration. Option A is the pod network with masquerade, where the guest uses DHCP. Option B, deferred, is a Multus network with bridge binding that can keep the L2 segment, IP and MAC. Network migration is a mapping problem, not simply a NIC swap.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="m475569" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="m64748b" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="960" fill="#ffffff"/>
  <text x="600.0" y="44" class="h" text-anchor="middle">Network mapping</text>
  <text x="600.0" y="70" class="sub" text-anchor="middle">Five decisions per NIC, before the VM is ever started</text>
  <rect x="40" y="110" width="300" height="330" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="190" y="146" class="lab" text-anchor="middle">VMWARE NIC</text>
  <text x="64" y="186" class="s" text-anchor="start" style="font-size:14px;fill:#334155">port group: "VM Network"</text>
  <text x="64" y="222" class="s" text-anchor="start" style="font-size:14px;fill:#334155">VLAN: 0</text>
  <text x="64" y="258" class="s" text-anchor="start" style="font-size:14px;fill:#334155">model: VMXNET3</text>
  <text x="64" y="294" class="s" text-anchor="start" style="font-size:14px;fill:#334155">MAC: 00:0c:29:.. (VMware prefix)</text>
  <text x="64" y="330" class="s" text-anchor="start" style="font-size:14px;fill:#334155">IP: static, from the ESXi subnet</text>
  <text x="64" y="366" class="s" text-anchor="start" style="font-size:14px;fill:#334155">guest name: ens192</text>
  <text x="600" y="132" class="lab" text-anchor="middle">THE MAPPING DECISION</text>
  <rect x="390" y="150" width="420" height="52" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <circle cx="418" cy="176" r="15" fill="#b45309"/>
  <text x="418" y="181" class="pill" text-anchor="middle" style="font-size:13px">1</text>
  <text x="446" y="172" class="t" text-anchor="start" style="font-size:15px">Destination network</text>
  <text x="446" y="192" class="s" text-anchor="start" style="font-size:12.5px">pod network, or a Multus network?</text>
  <rect x="390" y="212" width="420" height="52" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <circle cx="418" cy="238" r="15" fill="#b45309"/>
  <text x="418" y="243" class="pill" text-anchor="middle" style="font-size:13px">2</text>
  <text x="446" y="234" class="t" text-anchor="start" style="font-size:15px">Binding</text>
  <text x="446" y="254" class="s" text-anchor="start" style="font-size:12.5px">masquerade (pod) or bridge (secondary)</text>
  <rect x="390" y="274" width="420" height="52" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <circle cx="418" cy="300" r="15" fill="#b45309"/>
  <text x="418" y="305" class="pill" text-anchor="middle" style="font-size:13px">3</text>
  <text x="446" y="296" class="t" text-anchor="start" style="font-size:15px">IP addressing</text>
  <text x="446" y="316" class="s" text-anchor="start" style="font-size:12.5px">masquerade needs DHCP in the guest</text>
  <rect x="390" y="336" width="420" height="52" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <circle cx="418" cy="362" r="15" fill="#b45309"/>
  <text x="418" y="367" class="pill" text-anchor="middle" style="font-size:13px">4</text>
  <text x="446" y="358" class="t" text-anchor="start" style="font-size:15px">MAC address</text>
  <text x="446" y="378" class="s" text-anchor="start" style="font-size:12.5px">keep it (licensing, reservations) or not</text>
  <rect x="390" y="398" width="420" height="52" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <circle cx="418" cy="424" r="15" fill="#b45309"/>
  <text x="418" y="429" class="pill" text-anchor="middle" style="font-size:13px">5</text>
  <text x="446" y="420" class="t" text-anchor="start" style="font-size:15px">Guest OS config</text>
  <text x="446" y="440" class="s" text-anchor="start" style="font-size:12.5px">interface name may change: ens192 to enp1s0</text>
  <path d="M342,275 L386,275" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#m475569)"/>
  <path d="M812,230 L856,200" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#m475569)"/>
  <path d="M812,330 L856,370" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="9 6" marker-end="url(#m64748b)"/>
  <rect x="860" y="110" width="300" height="190" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="1010.0" y="171.96" class="t" text-anchor="middle" style="font-size:15.5px">A. Pod network + masquerade</text>
  <text x="1010.0" y="191.41" class="s" text-anchor="middle" style="font-size:13px">guest uses DHCP inside the Pod</text>
  <text x="1010.0" y="210.41" class="s" text-anchor="middle" style="font-size:13px">a static IP will not work as-is</text>
  <text x="1010.0" y="229.41" class="s" text-anchor="middle" style="font-size:13px">reach it through a Service</text>
  <text x="1010.0" y="248.41" class="s" text-anchor="middle" style="font-size:13px">new IP address</text>
  <rect x="1049" y="100" width="101" height="20" rx="10.0" fill="#334155"/>
  <text x="1099.5" y="113.96" class="pill" text-anchor="middle" style="font-size:11px">STAGE 0 PLAN</text>
  <rect x="860" y="330" width="300" height="170" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="1010.0" y="391.46" class="t" text-anchor="middle" style="font-size:15.5px">B. Multus NAD + bridge</text>
  <text x="1010.0" y="410.91" class="s" text-anchor="middle" style="font-size:13px">can keep L2 segment, IP, MAC</text>
  <text x="1010.0" y="429.91" class="s" text-anchor="middle" style="font-size:13px">needs node network setup</text>
  <text x="1010.0" y="448.91" class="s" text-anchor="middle" style="font-size:13px">no VLAN trunking to EC2</text>
  <rect x="1077" y="320" width="73" height="20" rx="10.0" fill="#475569"/>
  <text x="1113.5" y="333.96" class="pill" text-anchor="middle" style="font-size:11px">DEFERRED</text>
  <rect x="40" y="540" width="1120" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="600.0" y="580.44" class="t" text-anchor="middle" style="font-size:17px">Guest side risk</text>
  <text x="600.0" y="600.98" class="s" text-anchor="middle" style="font-size:14px">netplan / NetworkManager configs that match on the old interface name or MAC</text>
  <text x="600.0" y="620.98" class="s" text-anchor="middle" style="font-size:14px">can leave the guest with no network after the move, even though the VM boots</text>
  <rect x="1106" y="530" width="44" height="20" rx="10.0" fill="#b91c1c"/>
  <text x="1128.0" y="543.96" class="pill" text-anchor="middle" style="font-size:11px">RISK</text>
  <text x="600" y="700" class="s" text-anchor="middle" style="font-size:14px;fill:#334155;font-weight:600">Stage 1 later hit exactly this and fixed it offline at conversion time (ADR 010).</text>
  <rect x="30" y="740" width="1140" height="74" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="600.0" y="772" class="t" text-anchor="middle" style="font-size:20px;fill:#0f172a">Network migration is a mapping problem, not simply a NIC swap.</text>
  <text x="600.0" y="796" class="s" text-anchor="middle" style="font-size:14px;fill:#334155">The mapping must cover every NIC before the migration is allowed to start (checked in the Validated phase).</text>
  <rect x="224.5" y="870" width="34" height="20" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <rect x="266.5" y="870" width="80" height="20" rx="10.0" fill="#1d4ed8"/>
  <text x="306.5" y="883.96" class="pill" text-anchor="middle" style="font-size:11px">COMPONENT</text>
  <text x="354.5" y="885" class="xs" text-anchor="start">technology (documented)</text>
  <rect x="527.7" y="870" width="34" height="20" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <rect x="569.7" y="870" width="73" height="20" rx="10.0" fill="#475569"/>
  <text x="606.2" y="883.96" class="pill" text-anchor="middle" style="font-size:11px">DEFERRED</text>
  <text x="650.7" y="885" class="xs" text-anchor="start">optional, later</text>
  <rect x="772.7" y="870" width="34" height="20" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <rect x="814.7" y="870" width="44" height="20" rx="10.0" fill="#b91c1c"/>
  <text x="836.7" y="883.96" class="pill" text-anchor="middle" style="font-size:11px">RISK</text>
  <text x="866.7" y="885" class="xs" text-anchor="start">failure / blocker</text>
</svg>

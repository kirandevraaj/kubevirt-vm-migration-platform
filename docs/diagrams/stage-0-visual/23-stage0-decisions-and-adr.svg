<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">Stage 0 decisions: ADR 001 to ADR 005</title>
  <desc id="desc">Five accepted architecture decisions answer where the source lives, where the target lives, how the first migration works, what the destination is and who orchestrates. ADR 001: local nested ESXi 8 free edition as the source. ADR 002: AWS, Terraform-only and disposable, as the target. ADR 003: cold before warm. ADR 004: upstream KubeVirt with CDI. ADR 005: a custom controller with a VirtualMachineMigration resource, with scripts as building blocks. Later Stage 1 ADRs 006 to 010 are shown separately.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="m64748b" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ma16207" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker></defs>
  <rect width="1200" height="960" fill="#ffffff"/>
  <text x="600.0" y="44" class="h" text-anchor="middle">Stage 0 decisions (ADRs)</text>
  <text x="600.0" y="70" class="sub" text-anchor="middle">Five accepted decisions that shape everything after Stage 0</text>
  <rect x="440" y="380" width="320" height="110" rx="16" fill="#0f172a" stroke="#0f172a" stroke-width="1.6"/>
  <text x="600" y="424" class="t" text-anchor="middle" style="font-size:21px;fill:#ffffff">Stage 0 architecture</text>
  <text x="600" y="454" class="s" text-anchor="middle" style="font-size:15px;fill:#e2e8f0">"What should we build?"</text>
  <rect x="60" y="110" width="320" height="150" rx="14" fill="#fef9c3" stroke="#a16207" stroke-width="2.2"/>
  <circle cx="94" cy="146" r="24" fill="#a16207"/>
  <text x="94" y="151" class="pill" text-anchor="middle" style="font-size:13px">001</text>
  <text x="128" y="152" class="t" text-anchor="start" style="font-size:16px">Source: local nested ESXi</text>
  <text x="84" y="196" class="s" text-anchor="start" style="font-size:13.5px;fill:#334155">free ESXi 8.0 U3e on the laptop</text>
  <text x="84" y="220" class="s" text-anchor="start" style="font-size:13.5px;fill:#334155">why: no spare server or vSphere</text>
  <rect x="287" y="100" width="73" height="20" rx="10.0" fill="#a16207"/>
  <text x="323.5" y="113.96" class="pill" text-anchor="middle" style="font-size:11px">ACCEPTED</text>
  <rect x="820" y="110" width="320" height="150" rx="14" fill="#fef9c3" stroke="#a16207" stroke-width="2.2"/>
  <circle cx="854" cy="146" r="24" fill="#a16207"/>
  <text x="854" y="151" class="pill" text-anchor="middle" style="font-size:13px">002</text>
  <text x="888" y="152" class="t" text-anchor="start" style="font-size:16px">Target: AWS, disposable</text>
  <text x="844" y="196" class="s" text-anchor="start" style="font-size:13.5px;fill:#334155">created only through Terraform</text>
  <text x="844" y="220" class="s" text-anchor="start" style="font-size:13.5px;fill:#334155">why: laptop cannot host both</text>
  <rect x="1047" y="100" width="73" height="20" rx="10.0" fill="#a16207"/>
  <text x="1083.5" y="113.96" class="pill" text-anchor="middle" style="font-size:11px">ACCEPTED</text>
  <rect x="60" y="380" width="320" height="150" rx="14" fill="#fef9c3" stroke="#a16207" stroke-width="2.2"/>
  <circle cx="94" cy="416" r="24" fill="#a16207"/>
  <text x="94" y="421" class="pill" text-anchor="middle" style="font-size:13px">003</text>
  <text x="128" y="422" class="t" text-anchor="start" style="font-size:16px">Cold before warm</text>
  <text x="84" y="466" class="s" text-anchor="start" style="font-size:13.5px;fill:#334155">power off, copy, convert, import</text>
  <text x="84" y="490" class="s" text-anchor="start" style="font-size:13.5px;fill:#334155">why: free ESXi API is read-only</text>
  <rect x="287" y="370" width="73" height="20" rx="10.0" fill="#a16207"/>
  <text x="323.5" y="383.96" class="pill" text-anchor="middle" style="font-size:11px">ACCEPTED</text>
  <rect x="820" y="380" width="320" height="150" rx="14" fill="#fef9c3" stroke="#a16207" stroke-width="2.2"/>
  <circle cx="854" cy="416" r="24" fill="#a16207"/>
  <text x="854" y="421" class="pill" text-anchor="middle" style="font-size:13px">004</text>
  <text x="888" y="422" class="t" text-anchor="start" style="font-size:16px">Destination: KubeVirt + CDI</text>
  <text x="844" y="466" class="s" text-anchor="start" style="font-size:13.5px;fill:#334155">upstream, not OpenShift Virt.</text>
  <text x="844" y="490" class="s" text-anchor="start" style="font-size:13.5px;fill:#334155">why: VMs + containers, one platform</text>
  <rect x="1047" y="370" width="73" height="20" rx="10.0" fill="#a16207"/>
  <text x="1083.5" y="383.96" class="pill" text-anchor="middle" style="font-size:11px">ACCEPTED</text>
  <rect x="440" y="620" width="320" height="150" rx="14" fill="#fef9c3" stroke="#a16207" stroke-width="2.2"/>
  <circle cx="474" cy="656" r="24" fill="#a16207"/>
  <text x="474" y="661" class="pill" text-anchor="middle" style="font-size:13px">005</text>
  <text x="508" y="662" class="t" text-anchor="start" style="font-size:16px">Custom controller, not scripts</text>
  <text x="464" y="706" class="s" text-anchor="start" style="font-size:13.5px;fill:#334155">VirtualMachineMigration CR</text>
  <text x="464" y="730" class="s" text-anchor="start" style="font-size:13.5px;fill:#334155">scripts = building blocks only</text>
  <rect x="582" y="610" width="158" height="20" rx="10.0" fill="#a16207"/>
  <text x="661.0" y="623.96" class="pill" text-anchor="middle" style="font-size:11px">ACCEPTED (DIRECTION)</text>
  <path d="M382,185 L470,376" fill="none" stroke="#a16207" stroke-width="2.2" marker-end="url(#ma16207)"/>
  <path d="M818,185 L730,376" fill="none" stroke="#a16207" stroke-width="2.2" marker-end="url(#ma16207)"/>
  <path d="M382,455 L437,440" fill="none" stroke="#a16207" stroke-width="2.2" marker-end="url(#ma16207)"/>
  <path d="M818,455 L763,440" fill="none" stroke="#a16207" stroke-width="2.2" marker-end="url(#ma16207)"/>
  <path d="M600,617 L600,493" fill="none" stroke="#a16207" stroke-width="2.2" marker-end="url(#ma16207)"/>
  <path d="M220,262 L220,376" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="9 6" marker-end="url(#m64748b)"/>
  <text x="232" y="324" class="xs halo" text-anchor="start" style="font-weight:600">free ESXi shapes 003</text>
  <rect x="40" y="800" width="1120" height="120" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="60" y="828" class="lab" text-anchor="start">LATER, IN STAGE 1 (NOT PART OF STAGE 0)</text>
  <text x="60" y="858" class="s" text-anchor="start" style="font-size:14px;fill:#334155">006 dedicated conversion host   |   007 kubeadm on one nested-virtualization EC2 instance</text>
  <text x="60" y="884" class="s" text-anchor="start" style="font-size:14px;fill:#334155">008 pod network + masquerade   |   009 EBS gp3 PVC via CDI upload   |   010 netplan remediation at conversion</text>
</svg>

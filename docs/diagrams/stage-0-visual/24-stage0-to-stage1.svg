<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">From Stage 0 to Stage 1</title>
  <desc id="desc">Stage 0 asks what should we build and produced architecture documents, ADRs 001 to 005, a state machine design and a feasibility table. Stage 1 asks whether the important parts actually work: ESXi reboot persistence, KVM and QEMU fundamentals, the source VM, its artifacts, cold acquisition, a conversion host, conversion with QEMU and KVM boot validation, and a KubeVirt target design. Stage 1I is not started.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="m475569" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="600.0" y="44" class="h" text-anchor="middle">From Stage 0 to Stage 1</text>
  <text x="600.0" y="70" class="sub" text-anchor="middle">Design first, then evidence</text>
  <rect x="40" y="100" width="500" height="600" rx="18" fill="#fef9c3" stroke="#a16207" stroke-width="2.5" stroke-dasharray="9 5"/>
  <rect x="210.5" y="88" width="159" height="22" rx="11.0" fill="#a16207"/>
  <text x="290.0" y="103.68" class="pill" text-anchor="middle" style="font-size:13px">STAGE 0: COMPLETE</text>
  <text x="290" y="150" class="t" text-anchor="middle" style="font-size:32px;fill:#854d0e">Stage 0</text>
  <text x="290" y="180" class="s" text-anchor="middle" style="font-size:15px">architecture before implementation</text>
  <rect x="70" y="204" width="440" height="90" rx="12" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
  <text x="290" y="240" class="s" text-anchor="middle" style="font-size:15px">Stage 0 asks:</text>
  <text x="290" y="272" class="t" text-anchor="middle" style="font-size:22px">What should we build?</text>
  <path d="M84,340 L89.33333333333333,345.6 L100,333.6" fill="none" stroke="#a16207" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="114" y="346" class="s" text-anchor="start" style="font-size:15px">concepts: KVM, QEMU, KubeVirt, CRDs, CDI</text>
  <path d="M84,394 L89.33333333333333,399.6 L100,387.6" fill="none" stroke="#a16207" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="114" y="400" class="s" text-anchor="start" style="font-size:15px">migration flow + state machine design</text>
  <path d="M84,448 L89.33333333333333,453.6 L100,441.6" fill="none" stroke="#a16207" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="114" y="454" class="s" text-anchor="start" style="font-size:15px">networking + storage models</text>
  <path d="M84,502 L89.33333333333333,507.6 L100,495.6" fill="none" stroke="#a16207" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="114" y="508" class="s" text-anchor="start" style="font-size:15px">feasibility table (P / N / F rows)</text>
  <path d="M84,556 L89.33333333333333,561.6 L100,549.6" fill="none" stroke="#a16207" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="114" y="562" class="s" text-anchor="start" style="font-size:15px">ADR 001 to 005</text>
  <path d="M85,603 L99,617 M99,603 L85,617" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <text x="114" y="616" class="s" text-anchor="start" style="font-size:15px">nothing built, nothing installed</text>
  <rect x="660" y="100" width="500" height="600" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <rect x="809.5" y="88" width="201" height="22" rx="11.0" fill="#15803d"/>
  <text x="910.0" y="103.68" class="pill" text-anchor="middle" style="font-size:13px">STAGE 1: 1A TO 1H DONE</text>
  <text x="910" y="150" class="t" text-anchor="middle" style="font-size:32px;fill:#166534">Stage 1</text>
  <text x="910" y="180" class="s" text-anchor="middle" style="font-size:15px">build selected parts and observe them</text>
  <rect x="690" y="204" width="440" height="90" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="910" y="240" class="s" text-anchor="middle" style="font-size:15px">Stage 1 asks:</text>
  <text x="910" y="272" class="t" text-anchor="middle" style="font-size:17px">Can we actually make the important parts work?</text>
  <circle cx="712" cy="336" r="15" fill="#15803d"/>
  <text x="712" y="341" class="pill" text-anchor="middle" style="font-size:13px">1A</text>
  <text x="738" y="342" class="s" text-anchor="start" style="font-size:15px">ESXi survives a controlled reboot</text>
  <circle cx="712" cy="380" r="15" fill="#15803d"/>
  <text x="712" y="385" class="pill" text-anchor="middle" style="font-size:13px">1B</text>
  <text x="738" y="386" class="s" text-anchor="start" style="font-size:15px">KVM / QEMU / libvirt fundamentals</text>
  <circle cx="712" cy="424" r="15" fill="#15803d"/>
  <text x="712" y="429" class="pill" text-anchor="middle" style="font-size:13px">1C</text>
  <text x="738" y="430" class="s" text-anchor="start" style="font-size:15px">the VMware source VM (nginx)</text>
  <circle cx="712" cy="468" r="15" fill="#15803d"/>
  <text x="712" y="473" class="pill" text-anchor="middle" style="font-size:13px">1D</text>
  <text x="738" y="474" class="s" text-anchor="start" style="font-size:15px">source artifacts + VMDK layout</text>
  <circle cx="712" cy="512" r="15" fill="#15803d"/>
  <text x="712" y="517" class="pill" text-anchor="middle" style="font-size:13px">1E</text>
  <text x="738" y="518" class="s" text-anchor="start" style="font-size:15px">cold disk acquisition, sha256 verified</text>
  <circle cx="712" cy="556" r="15" fill="#15803d"/>
  <text x="712" y="561" class="pill" text-anchor="middle" style="font-size:13px">1F</text>
  <text x="738" y="562" class="s" text-anchor="start" style="font-size:15px">dedicated conversion host</text>
  <circle cx="712" cy="600" r="15" fill="#15803d"/>
  <text x="712" y="605" class="pill" text-anchor="middle" style="font-size:13px">1G</text>
  <text x="738" y="606" class="s" text-anchor="start" style="font-size:15px">conversion + QEMU/KVM boot + network fix</text>
  <circle cx="712" cy="644" r="15" fill="#a16207"/>
  <text x="712" y="649" class="pill" text-anchor="middle" style="font-size:13px">1H</text>
  <text x="738" y="650" class="s" text-anchor="start" style="font-size:15px">KubeVirt target: design only</text>
  <text x="910" y="682" class="t" text-anchor="middle" style="font-size:14px;fill:#475569">Stage 1I: not started</text>
  <path d="M544,400 L656,400" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#m475569)"/>
  <text x="600" y="370" class="s" text-anchor="middle" style="font-size:12px;fill:#334155;font-weight:700">turns</text>
  <text x="600" y="388" class="s" text-anchor="middle" style="font-size:12px;fill:#334155;font-weight:700">UNVALIDATED</text>
  <text x="600" y="436" class="s" text-anchor="middle" style="font-size:12px;fill:#334155;font-weight:700">into</text>
  <text x="600" y="454" class="s" text-anchor="middle" style="font-size:12px;fill:#334155;font-weight:700">evidence</text>
  <rect x="30" y="730" width="1140" height="74" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="600.0" y="762" class="t" text-anchor="middle" style="font-size:20px;fill:#0f172a">Stage 0 gives us the map. Stage 1 proves selected roads on the map.</text>
  <text x="600.0" y="786" class="s" text-anchor="middle" style="font-size:14px;fill:#334155">Stage 1 is documented separately: see the Stage 1 Visual Learning page.</text>
  <rect x="317.9" y="846" width="34" height="20" rx="5" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <rect x="359.9" y="846" width="115" height="20" rx="10.0" fill="#a16207"/>
  <text x="417.4" y="859.96" class="pill" text-anchor="middle" style="font-size:11px">STAGE 0 DESIGN</text>
  <text x="482.9" y="861" class="xs" text-anchor="start">on paper, not built</text>
  <rect x="630.5" y="846" width="34" height="20" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <rect x="672.5" y="846" width="80" height="20" rx="10.0" fill="#15803d"/>
  <text x="712.5" y="859.96" class="pill" text-anchor="middle" style="font-size:11px">VALIDATED</text>
  <text x="760.5" y="861" class="xs" text-anchor="start">observed in our lab</text>
</svg>

  <text x="710.0" y="563.87" class="t" text-anchor="middle" style="font-size:16px">QEMU</text>
  <text x="710.0" y="583.0" class="s" text-anchor="middle" style="font-size:12.5px">with libvirt, inside the Pod</text>

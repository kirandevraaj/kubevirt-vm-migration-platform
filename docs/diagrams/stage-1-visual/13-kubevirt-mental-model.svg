  <text x="710.0" y="671.0" class="s" text-anchor="middle" style="font-size:12.5px">/dev/kvm on the node</text>
  <path d="M710,598 L710,625" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="520" y="716" width="380" height="56" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="710.0" y="739.87" class="t" text-anchor="middle" style="font-size:16px">VM guest</text>
  <text x="710.0" y="759.0" class="s" text-anchor="middle" style="font-size:12.5px">Ubuntu + nginx</text>

  <path d="M235,508 L235,463" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="70" y="620" width="330" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="235.0" y="645.87" class="t" text-anchor="middle" style="font-size:16px">disk image</text>
  <text x="235.0" y="665.0" class="s" text-anchor="middle" style="font-size:12.5px">prepared qcow2 (virt-v2v + fix)</text>
  <path d="M235,618 L235,573" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <path d="M402,320 L455,320 L455,480 L517,480" fill="none" stroke="#15803d" stroke-width="2.6" marker-end="url(#m15803d)"/>
  <text x="461" y="430" class="xs halo" text-anchor="start" style="fill:#15803d;font-weight:700">VM disk</text>
  <rect x="950" y="188" width="220" height="110" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="1060.0" y="218.87" class="t" text-anchor="middle" style="font-size:16px">CDI</text>
  <text x="1060.0" y="238.82" class="s" text-anchor="middle" style="font-size:13.5px">ends when the PVC</text>
  <text x="1060.0" y="258.32" class="s" text-anchor="middle" style="font-size:13.5px">holds a raw</text>
  <text x="1060.0" y="277.82" class="s" text-anchor="middle" style="font-size:13.5px">bootable disk</text>
  <rect x="950" y="318" width="220" height="110" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="1060.0" y="348.87" class="t" text-anchor="middle" style="font-size:16px">KubeVirt</text>
  <text x="1060.0" y="368.82" class="s" text-anchor="middle" style="font-size:13.5px">starts when a</text>
  <text x="1060.0" y="388.32" class="s" text-anchor="middle" style="font-size:13.5px">VirtualMachine</text>
  <text x="1060.0" y="407.82" class="s" text-anchor="middle" style="font-size:13.5px">references the PVC</text>
  <rect x="950" y="448" width="220" height="90" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="1060.0" y="488.37" class="t" text-anchor="middle" style="font-size:16px">CDI never</text>
  <text x="1060.0" y="508.32" class="s" text-anchor="middle" style="font-size:13.5px">runs the VM</text>
  <rect x="950" y="560" width="220" height="80" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="1060.0" y="595.37" class="t" text-anchor="middle" style="font-size:16px">The seam</text>
  <text x="1060.0" y="615.32" class="s" text-anchor="middle" style="font-size:13.5px">is the PVC</text>
</svg>

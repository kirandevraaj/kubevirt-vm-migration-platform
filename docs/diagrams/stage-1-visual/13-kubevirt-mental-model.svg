  <rect x="70" y="290" width="330" height="60" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="235.0" y="315.87" class="t" text-anchor="middle" style="font-size:16px">PVC</text>
  <text x="235.0" y="335.0" class="s" text-anchor="middle" style="font-size:12.5px">40Gi gp3, Block, RWO (ADR 009)</text>

  <text x="1084.0" y="97.96" class="pill" text-anchor="middle" style="font-size:11px">CONCEPT - NOT DEPLOYED</text>
  <rect x="490" y="166" width="440" height="444" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="506" y="184" class="lab" text-anchor="start" style="fill:#1d4ed8">KUBEVIRT: VM LIFECYCLE</text>
  <rect x="40" y="248" width="390" height="450" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="56" y="272" class="lab" text-anchor="start" style="fill:#b45309">CDI: DISK IMPORT + STORAGE</text>

  <text x="235.0" y="425.87" class="t" text-anchor="middle" style="font-size:16px">DataVolume</text>
  <text x="235.0" y="445.0" class="s" text-anchor="middle" style="font-size:12.5px">CDI object: create + fill a PVC</text>
  <path d="M235,398 L235,353" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="70" y="510" width="330" height="60" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="235.0" y="535.87" class="t" text-anchor="middle" style="font-size:16px">CDI upload</text>

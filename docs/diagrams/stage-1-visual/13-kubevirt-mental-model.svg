  <text x="710.0" y="123.87" class="t" text-anchor="middle" style="font-size:16px">Kubernetes API</text>
  <text x="710.0" y="143.0" class="s" text-anchor="middle" style="font-size:12.5px">kubectl / Git</text>
  <rect x="520" y="188" width="380" height="56" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="710.0" y="211.87" class="t" text-anchor="middle" style="font-size:16px">VirtualMachine</text>
  <text x="710.0" y="231.0" class="s" text-anchor="middle" style="font-size:12.5px">custom resource: desired state</text>
  <path d="M710,158 L710,185" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="520" y="276" width="380" height="56" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="710.0" y="299.87" class="t" text-anchor="middle" style="font-size:16px">KubeVirt controllers</text>
  <text x="710.0" y="319.0" class="s" text-anchor="middle" style="font-size:12.5px">virt-controller</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1480" viewBox="0 0 1200 1480" role="img" aria-labelledby="title desc">
  <title id="title">Final pipeline: the 30-second view</title>
  <desc id="desc">Done band (1A to 1G): VMware Workstation, ESXi, legacy-source-vm with Ubuntu and nginx, VMDK, cold copy, golden artifact, conversion-host-01, qemu-img and virt-v2v, KVM/QEMU, UEFI plus VirtIO, bootable VM. Designed band (1H): Kubernetes with KubeVirt and CDI; CDI fills a PVC, the VirtualMachine runs in a virt-launcher Pod with QEMU on KVM. Future band: native Kubernetes application.</desc>

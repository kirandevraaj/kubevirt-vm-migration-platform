  <title id="title">Our actual lab after Stage 1H</title>
  <desc id="desc">Windows 11 laptop runs VMware Workstation, which runs nested ESXi 8.0.3 at 192.168.50.11. On ESXi: SOURCE zone legacy-source-vm (192.168.50.31, powered on), LEARNING zone kvm-learning-01 (learning only, powered off), CONVERSION zone conversion-host-01 (192.168.50.32, qemu-img, libguestfs, virt-v2v). The golden artifact sits on Windows outside VMware. The AWS target is design only and does not exist.</desc>

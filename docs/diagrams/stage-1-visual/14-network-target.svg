<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
  <title id="title">Target network design (ADR 008)</title>
  <desc id="desc">Inside the EC2 node, a virt-launcher Pod with a pod IP connects to the guest through the masquerade binding; the guest gets 10.0.2.2 by KubeVirt DHCP. A request goes from the operator's /32 to NodePort 30080, the Service, the virt-launcher Pod, masquerade, and the guest on port 80. 192.168.50.31 is not preserved; continuity is proven by content. Design only.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="m475569" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="830" fill="#ffffff"/>
  <text x="600.0" y="44" class="h" text-anchor="middle">Target network (ADR 008)</text>
  <text x="600.0" y="70" class="sub" text-anchor="middle">Masquerade on the pod network - the old IP is not preserved</text>
  <rect x="1076" y="84" width="94" height="20" rx="10.0" fill="#a16207"/>
  <text x="1123.0" y="97.96" class="pill" text-anchor="middle" style="font-size:11px">DESIGN ONLY</text>
  <rect x="40" y="110" width="560" height="410" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="58" y="136" class="lab" text-anchor="start" style="fill:#c2410c">EC2 NODE (VPC address)</text>
  <rect x="70" y="160" width="500" height="334" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="88" y="184" class="lab" text-anchor="start" style="fill:#1d4ed8">virt-launcher Pod (pod IP on flannel)</text>
  <rect x="110" y="210" width="420" height="64" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="320.0" y="237.87" class="t" text-anchor="middle" style="font-size:16px">masquerade binding</text>
  <text x="320.0" y="257.0" class="s" text-anchor="middle" style="font-size:12.5px">NAT between the pod IP and the guest</text>
  <path d="M320,276 L320,327" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="110" y="330" width="420" height="120" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="320.0" y="366.19" class="t" text-anchor="middle" style="font-size:17px">guest: Ubuntu + nginx :80</text>
  <text x="320.0" y="386.32" class="s" text-anchor="middle" style="font-size:13.5px">10.0.2.2/24 from KubeVirt DHCP</text>
  <text x="320.0" y="405.82" class="s" text-anchor="middle" style="font-size:13.5px">gateway 10.0.2.1</text>
  <text x="320.0" y="425.32" class="s" text-anchor="middle" style="font-size:13.5px">(what the netplan DHCP fix expects)</text>
  <text x="900" y="106" class="lab" text-anchor="middle">HOW A REQUEST REACHES NGINX</text>
  <rect x="680" y="118" width="440" height="54" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="900.0" y="140.87" class="t" text-anchor="middle" style="font-size:16px">operator</text>
  <text x="900.0" y="160.0" class="s" text-anchor="middle" style="font-size:12.5px">only one /32 allowed</text>
  <rect x="680" y="194" width="440" height="54" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="900.0" y="226.12" class="t" text-anchor="middle" style="font-size:16px">NodePort 30080</text>
  <path d="M900,174 L900,191" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="680" y="270" width="440" height="54" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="900.0" y="292.87" class="t" text-anchor="middle" style="font-size:16px">Service</text>
  <text x="900.0" y="312.0" class="s" text-anchor="middle" style="font-size:12.5px">stable entry point</text>
  <path d="M900,250 L900,267" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="680" y="346" width="440" height="54" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="900.0" y="378.12" class="t" text-anchor="middle" style="font-size:16px">virt-launcher Pod</text>
  <path d="M900,326 L900,343" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="680" y="422" width="440" height="54" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="900.0" y="454.12" class="t" text-anchor="middle" style="font-size:16px">masquerade</text>
  <path d="M900,402 L900,419" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="680" y="498" width="440" height="54" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="900.0" y="520.87" class="t" text-anchor="middle" style="font-size:16px">guest :80 (nginx)</text>
  <text x="900.0" y="540.0" class="s" text-anchor="middle" style="font-size:12.5px">10.0.2.2</text>
  <path d="M900,478 L900,495" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="40" y="580" width="360" height="130" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="220" y="638" class="h" text-anchor="middle" style="font-size:30px;fill:#7f1d1d">192.168.50.31</text>
  <line x1="100" y1="628" x2="340" y2="628" stroke="#b91c1c" stroke-width="4"/>
  <path d="M66,616 L90,640 M90,616 L66,640" stroke="#b91c1c" stroke-width="5" stroke-linecap="round"/>
  <rect x="157.5" y="662" width="125" height="22" rx="11.0" fill="#b91c1c"/>
  <text x="220.0" y="677.68" class="pill" text-anchor="middle" style="font-size:13px">NOT PRESERVED</text>
  <rect x="420" y="580" width="750" height="130" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="434" y="611.12" class="t" text-anchor="start" style="font-size:16px">Why the old IP cannot follow the VM</text>
  <text x="434" y="631.07" class="s" text-anchor="start" style="font-size:13.5px">VMnet8 (the laptop's NAT network) is not reachable from AWS</text>
  <text x="434" y="650.57" class="s" text-anchor="start" style="font-size:13.5px">masquerade assigns the guest address</text>
  <text x="434" y="670.07" class="s" text-anchor="start" style="font-size:13.5px">a VPC drops addresses it did not assign</text>
  <text x="434" y="689.57" class="s" text-anchor="start" style="font-size:13.5px">the source keeps .31 as the reference and rollback</text>
  <rect x="40" y="730" width="1130" height="76" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="605.0" y="763.76" class="t" text-anchor="middle" style="font-size:18px">Continuity is proven by workload / content (the same page sha256)</text>
  <text x="605.0" y="784.48" class="s" text-anchor="middle" style="font-size:14px">not by the old infrastructure IP</text>
</svg>

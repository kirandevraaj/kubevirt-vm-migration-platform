  <text x="600.0" y="834.48" class="s" text-anchor="middle" style="font-size:14px">same driver match, but DHCP (dhcp4: true)  &#8594;  guest gets 10.0.2.2 from KubeVirt masquerade (ADR 008)</text>
  <rect x="1101" y="772" width="59" height="20" rx="10.0" fill="#a16207"/>

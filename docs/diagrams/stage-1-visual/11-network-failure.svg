<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">The network failure and the lab proof</title>
  <desc id="desc">Before, on VMware: VMXNET3, ens192, netplan matches ens192, static 192.168.50.31, nginx reachable. After conversion: virtio-net, enp0s3, netplan still expects ens192, no match, no IP, nginx unreachable from outside. Lab proof on a disposable copy: netplan match by driver virtio_net, static test address 10.0.2.15 on an isolated QEMU network, interface routable, nginx HTTP 200, same page sha256. 192.168.50.31 was never used in the test. Target design ADR 010 uses the driver match with DHCP.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="m475569" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="880" fill="#ffffff"/>
  <text x="600.0" y="44" class="h" text-anchor="middle">The network failure, and the lab proof</text>

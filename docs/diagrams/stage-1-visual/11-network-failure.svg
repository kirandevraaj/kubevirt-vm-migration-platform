  <text x="210.0" y="129.0" class="s" text-anchor="middle" style="font-size:12.5px">VMware, 1C</text>
  <rect x="420" y="84" width="360" height="58" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="600.0" y="109.51" class="t" text-anchor="middle" style="font-size:18px">AFTER CONVERSION</text>
  <text x="600.0" y="129.0" class="s" text-anchor="middle" style="font-size:12.5px">both paths, 1G</text>
  <rect x="718" y="74" width="52" height="20" rx="10.0" fill="#b91c1c"/>
  <text x="744.0" y="87.96" class="pill" text-anchor="middle" style="font-size:11px">FAILS</text>
  <rect x="810" y="84" width="360" height="58" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="990.0" y="109.51" class="t" text-anchor="middle" style="font-size:18px">LAB PROOF</text>
  <text x="990.0" y="129.0" class="s" text-anchor="middle" style="font-size:12.5px">disposable copy, 1G</text>
  <rect x="1080" y="74" width="80" height="20" rx="10.0" fill="#15803d"/>
  <text x="1120.0" y="87.96" class="pill" text-anchor="middle" style="font-size:11px">LAB PROOF</text>
  <rect x="50" y="170" width="320" height="58" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="210.0" y="204.12" class="t" text-anchor="middle" style="font-size:16px">VMXNET3</text>
  <rect x="50" y="254" width="320" height="58" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="210.0" y="288.12" class="t" text-anchor="middle" style="font-size:16px">ens192</text>
  <path d="M210,230 L210,251" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="50" y="338" width="320" height="58" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="210.0" y="362.87" class="t" text-anchor="middle" style="font-size:16px">netplan match</text>
  <text x="210.0" y="382.0" class="s" text-anchor="middle" style="font-size:12.5px">name: ens192</text>
  <path d="M210,314 L210,335" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>

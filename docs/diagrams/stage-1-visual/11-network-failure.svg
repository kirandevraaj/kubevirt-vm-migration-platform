  <text x="600.0" y="288.12" class="t" text-anchor="middle" style="font-size:16px">enp0s3</text>
  <path d="M600,230 L600,251" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="440" y="338" width="320" height="58" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>

  <text x="600.0" y="614.87" class="t" text-anchor="middle" style="font-size:16px">nginx unreachable externally</text>
  <text x="600.0" y="634.0" class="s" text-anchor="middle" style="font-size:12.5px">running and healthy inside</text>
  <path d="M600,566 L600,587" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="830" y="170" width="320" height="58" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="990.0" y="194.87" class="t" text-anchor="middle" style="font-size:16px">netplan match</text>
  <text x="990.0" y="214.0" class="s" text-anchor="middle" style="font-size:12.5px">driver = virtio_net</text>
  <rect x="830" y="254" width="320" height="58" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="990.0" y="278.87" class="t" text-anchor="middle" style="font-size:16px">test address 10.0.2.15/24</text>
  <text x="990.0" y="298.0" class="s" text-anchor="middle" style="font-size:12.5px">static, dhcp4: false</text>

  <rect x="830" y="338" width="320" height="58" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <text x="990.0" y="362.87" class="t" text-anchor="middle" style="font-size:16px">isolated QEMU network</text>
  <text x="990.0" y="382.0" class="s" text-anchor="middle" style="font-size:12.5px">no DNS: NOT TESTED</text>

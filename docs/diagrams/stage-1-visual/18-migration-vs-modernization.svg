<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Migration versus modernization</title>
  <desc id="desc">Left, migration: a VM on ESXi with Ubuntu and nginx becomes a VM on KubeVirt with the same Ubuntu and nginx; only the hypervisor and manager differ. Right, modernization (future, Stage 0 model): extract the application from the Ubuntu VM into a container image, run it as a Deployment behind a Service. Migrating keeps the VM model; modernizing removes it.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="m475569" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="m64748b" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="740" fill="#ffffff"/>
  <text x="600.0" y="44" class="h" text-anchor="middle">Migration vs modernization</text>
  <rect x="30" y="84" width="550" height="500" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="305" y="116" class="h2" text-anchor="middle" style="font-size:19px;fill:#1d4ed8">MIGRATION (rehost)</text>
  <rect x="141.0" y="128" width="328" height="20" rx="10.0" fill="#1d4ed8"/>
  <text x="305.0" y="141.96" class="pill" text-anchor="middle" style="font-size:11px">STAGE 1: PROVEN TO KVM BOOT, TARGET DESIGNED</text>
  <rect x="70" y="170" width="270" height="150" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="205" y="198" class="t" text-anchor="middle" style="font-size:16px">VM on ESXi</text>
  <rect x="95" y="216" width="220" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="205.0" y="251.87" class="t" text-anchor="middle" style="font-size:16px">Ubuntu + nginx</text>
  <text x="205.0" y="271.0" class="s" text-anchor="middle" style="font-size:12.5px">guest OS + app</text>
  <rect x="70" y="390" width="270" height="150" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="205" y="418" class="t" text-anchor="middle" style="font-size:16px">VM on KubeVirt</text>
  <rect x="95" y="436" width="220" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="205.0" y="471.87" class="t" text-anchor="middle" style="font-size:16px">Ubuntu + nginx</text>
  <text x="205.0" y="491.0" class="s" text-anchor="middle" style="font-size:12.5px">guest OS + app</text>
  <path d="M205,322 L205,387" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#m475569)"/>
  <text x="215" y="360" class="xs halo" text-anchor="start" style="font-weight:600">migrate</text>
  <path d="M364,245 L369.3333333333333,250.6 L380,238.6" fill="none" stroke="#15803d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="390" y="250" class="t" text-anchor="start" style="font-size:15px">same Ubuntu</text>
  <path d="M364,279 L369.3333333333333,284.6 L380,272.6" fill="none" stroke="#15803d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="390" y="284" class="t" text-anchor="start" style="font-size:15px">same nginx</text>
  <path d="M364,313 L369.3333333333333,318.6 L380,306.6" fill="none" stroke="#15803d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="390" y="318" class="t" text-anchor="start" style="font-size:15px">same page sha256</text>
  <text x="365" y="372" class="t" text-anchor="start" style="font-size:14px;fill:#b45309">different:</text>
  <text x="365" y="394" class="s" text-anchor="start" style="font-size:14px">hypervisor + manager</text>
  <text x="365" y="414" class="s" text-anchor="start" style="font-size:13px">(ESXi &#8594; KVM + KubeVirt)</text>
  <rect x="620" y="84" width="550" height="500" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 4"/>
  <text x="895" y="116" class="h2" text-anchor="middle" style="font-size:19px;fill:#334155">MODERNIZATION (replatform)</text>
  <rect x="791.0" y="128" width="208" height="20" rx="10.0" fill="#475569"/>
  <text x="895.0" y="141.96" class="pill" text-anchor="middle" style="font-size:11px">FUTURE - STAGE 0 MODEL ONLY</text>
  <rect x="700" y="168" width="390" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="895.0" y="191.87" class="t" text-anchor="middle" style="font-size:16px">Ubuntu VM</text>
  <text x="895.0" y="211.0" class="s" text-anchor="middle" style="font-size:12.5px">nginx inside a guest OS</text>
  <rect x="700" y="250" width="390" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="895.0" y="273.87" class="t" text-anchor="middle" style="font-size:16px">extract application</text>
  <text x="895.0" y="293.0" class="s" text-anchor="middle" style="font-size:12.5px">nginx config + site content</text>
  <path d="M895,226 L895,247" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#m64748b)" stroke-linecap="round"/>
  <rect x="700" y="332" width="390" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="895.0" y="355.87" class="t" text-anchor="middle" style="font-size:16px">container image</text>
  <text x="895.0" y="375.0" class="s" text-anchor="middle" style="font-size:12.5px">pinned, referenced by digest</text>
  <path d="M895,308 L895,329" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#m64748b)" stroke-linecap="round"/>
  <rect x="700" y="414" width="390" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="895.0" y="437.87" class="t" text-anchor="middle" style="font-size:16px">Deployment</text>
  <text x="895.0" y="457.0" class="s" text-anchor="middle" style="font-size:12.5px">replicas, rolling updates</text>
  <path d="M895,390 L895,411" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#m64748b)" stroke-linecap="round"/>
  <rect x="700" y="496" width="390" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="895.0" y="519.87" class="t" text-anchor="middle" style="font-size:16px">Service</text>
  <text x="895.0" y="539.0" class="s" text-anchor="middle" style="font-size:12.5px">stable name, load balancing</text>
  <path d="M895,472 L895,493" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="2 5" marker-end="url(#m64748b)" stroke-linecap="round"/>
  <rect x="30" y="606" width="550" height="64" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="305.0" y="644.72" class="t" text-anchor="middle" style="font-size:21px">Migrating keeps the VM model.</text>
  <rect x="620" y="606" width="550" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="895.0" y="644.72" class="t" text-anchor="middle" style="font-size:21px">Modernizing removes the VM model.</text>
  <text x="600" y="712" class="sub" text-anchor="middle" style="font-size:16px;font-weight:700">A VM on KubeVirt is still a VM (Stage 0).</text>
</svg>

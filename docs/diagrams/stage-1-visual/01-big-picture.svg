<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1340" viewBox="0 0 1100 1340" role="img" aria-labelledby="title desc">
  <title id="title">Stage 1 big picture: from VMware VM to Kubernetes-managed VM</title>
  <desc id="desc">Vertical journey. Source world: VMware Workstation, ESXi (1A), legacy-source-vm with Ubuntu and nginx (1C), its VMDK (1D). Moving the disk: cold acquisition (1E). KVM world: conversion workbench (1F), qemu-img and virt-v2v paths (1G) into KVM/QEMU and a bootable VM. Kubernetes world: KubeVirt target designed in 1H, Kubernetes VM future. Modernization: future native workload. Side branch 1B: kvm-learning-01 taught KVM, QEMU, libvirt and VirtIO. Solid green boxes are done, dashed yellow are designed, dotted grey are future.</desc>

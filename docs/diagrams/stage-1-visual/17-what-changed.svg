  <title id="title">What changed from VMware to KVM and KubeVirt</title>
  <desc id="desc">Nine cards compare VMware with KVM/KubeVirt: manager, CPU virtualization, VM process, disk, NIC, firmware, network, VM definition and storage management, each marked proven in 1G or design in 1H. Unchanged, observed in 1G: Ubuntu, kernel command line, filesystem and partition UUIDs, machine-id, SSH host keys, nginx.</desc>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">What is a VM? Anatomy and the VMware implementation</title>
  <desc id="desc">Left: a generic VM made of CPU, RAM, firmware, virtual NIC, virtual disk and a guest OS containing kernel, filesystem, network configuration and application. Right: how legacy-source-vm implements each on VMware: 2 vCPU, 4096 MB, VMware UEFI with .nvram, VMXNET3 as ens192, PVSCSI with a VMDK, Ubuntu kernel, ext4 by UUID, netplan matching ens192 (risk), nginx.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-size: 24px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 14px; fill: #334155; }
    .t { font-weight: 600; fill: #0f172a; }
    .s { fill: #1f2937; }
    .xs { font-size: 12px; fill: #334155; }
    .lab { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .pill { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs><marker id="m475569" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="790" fill="#ffffff"/>
  <text x="600.0" y="44" class="h" text-anchor="middle">What is a VM? More than a disk.</text>
  <rect x="30" y="84" width="470" height="626" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="265" y="114" class="h2" text-anchor="middle">A VM (generic)</text>
  <text x="935" y="114" class="h2" text-anchor="middle">VMware implementation: legacy-source-vm</text>
  <text x="935" y="134" class="xs" text-anchor="middle">all of this is described by the .vmx</text>
  <rect x="60" y="140" width="410" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="265.0" y="167.8" class="t" text-anchor="middle" style="font-size:15px">CPU</text>
  <rect x="700" y="140" width="470" height="46" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="935.0" y="167.48" class="t" text-anchor="middle" style="font-size:14px">2 vCPU</text>
  <path d="M472,163 L697,163" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="60" y="200" width="410" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="265.0" y="227.8" class="t" text-anchor="middle" style="font-size:15px">RAM</text>
  <rect x="700" y="200" width="470" height="46" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="935.0" y="227.48" class="t" text-anchor="middle" style="font-size:14px">4096 MB</text>
  <path d="M472,223 L697,223" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="60" y="260" width="410" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="265.0" y="287.8" class="t" text-anchor="middle" style="font-size:15px">Firmware</text>
  <rect x="700" y="260" width="470" height="46" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="935.0" y="287.48" class="t" text-anchor="middle" style="font-size:14px">VMware UEFI + .nvram (Secure Boot off)</text>
  <path d="M472,283 L697,283" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="60" y="320" width="410" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="265.0" y="347.8" class="t" text-anchor="middle" style="font-size:15px">Virtual NIC</text>
  <rect x="700" y="320" width="470" height="46" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="935.0" y="347.48" class="t" text-anchor="middle" style="font-size:14px">VMXNET3  &#8594;  ens192</text>
  <path d="M472,343 L697,343" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="60" y="380" width="410" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="265.0" y="407.8" class="t" text-anchor="middle" style="font-size:15px">Virtual Disk</text>
  <rect x="700" y="380" width="470" height="46" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="935.0" y="407.48" class="t" text-anchor="middle" style="font-size:14px">PVSCSI  &#8594;  VMDK (40 GB thin)</text>
  <path d="M472,403 L697,403" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="60" y="450" width="410" height="240" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="1.8"/>
  <text x="265" y="476" class="t" text-anchor="middle" style="font-size:15px">Guest OS</text>
  <rect x="84" y="492" width="362" height="38" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="265.0" y="515.48" class="t" text-anchor="middle" style="font-size:14px">Kernel</text>
  <rect x="700" y="492" width="470" height="38" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="935.0" y="515.48" class="t" text-anchor="middle" style="font-size:14px">Ubuntu 24.04.5 kernel (VirtIO built in)</text>
  <path d="M448,511 L697,511" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="84" y="540" width="362" height="38" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="265.0" y="563.48" class="t" text-anchor="middle" style="font-size:14px">Filesystem</text>
  <rect x="700" y="540" width="470" height="38" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="935.0" y="563.48" class="t" text-anchor="middle" style="font-size:14px">ext4 root + EFI partition, by UUID</text>
  <path d="M448,559 L697,559" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="84" y="588" width="362" height="38" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="265.0" y="611.48" class="t" text-anchor="middle" style="font-size:14px">Network configuration</text>
  <rect x="700" y="588" width="470" height="38" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="935.0" y="611.48" class="t" text-anchor="middle" style="font-size:14px">netplan: match name ens192, static .31</text>
  <rect x="1116" y="578" width="44" height="20" rx="10.0" fill="#b91c1c"/>
  <text x="1138.0" y="591.96" class="pill" text-anchor="middle" style="font-size:11px">RISK</text>
  <path d="M448,607 L697,607" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="84" y="636" width="362" height="38" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="265.0" y="659.48" class="t" text-anchor="middle" style="font-size:14px">Application</text>
  <rect x="700" y="636" width="470" height="38" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="935.0" y="659.48" class="t" text-anchor="middle" style="font-size:14px">nginx (267-byte validation page)</text>
  <path d="M448,655 L697,655" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#m475569)"/>
  <rect x="30" y="726" width="1140" height="50" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="600.0" y="755.8" class="s" text-anchor="middle" style="font-size:15px">Only the disk bytes are copied (1D). CPU, RAM, NIC and firmware settings are re-created on the target.</text>
</svg>

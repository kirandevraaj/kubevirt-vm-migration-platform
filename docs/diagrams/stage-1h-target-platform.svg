<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="930" viewBox="0 0 1240 930" role="img" aria-labelledby="title desc">
  <title id="title">Stage 1H: chosen KubeVirt target platform for the first migration (DESIGN, not provisioned)</title>
  <desc id="desc">The management workstation reaches a disposable AWS environment in ap-south-1 over SSH and one validation NodePort, both limited to the operator's /32. The VPC has one public subnet in one Availability Zone. One EC2 m8i.xlarge instance with nested virtualization runs CentOS Stream 9 with an EL9 kernel, CRI-O 1.36 and a single-node kubeadm Kubernetes 1.36 cluster. The cluster runs kube-system components with flannel, KubeVirt v1.9.0, CDI v1.66.1 and the EBS CSI driver. The migrated VM runs in a virt-launcher pod with QEMU and KVM, has a virtio disk backed by a 40 GiB raw Block PVC on EBS gp3 and a virtio NIC on the pod network with masquerade binding, and is exposed by a NodePort Service. The local lab, with the source VM still running at 192.168.50.31 on VMnet8, has no network path into the VPC; only a prepared disk image is transferred in a future stage.</desc>
  <style>
    .h { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .c { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .t { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #111827; }
    .s { font: 11.5px 'Segoe UI', Arial, sans-serif; fill: #374151; }
    .l { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
    .n { font: 12px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    .r { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #b91c1c; }
    .g { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #15803d; }
    .box { stroke: #334155; stroke-width: 1.3; }
    .dash { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 7 5; fill: #f8fafc; }
    .arr { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .darr { stroke: #94a3b8; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#g); }
    .xarr { stroke: #b91c1c; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1240" height="930" fill="#ffffff"/>
  <text x="620" y="32" text-anchor="middle" class="h">Stage 1H: chosen target for the first KubeVirt migration (DESIGN, nothing provisioned)</text>

  <!-- Management workstation -->
  <rect x="30" y="60" width="270" height="250" rx="10" class="box" fill="#f1f5f9"/>
  <text x="44" y="84" class="c">Management workstation</text>
  <text x="44" y="102" class="s">Windows 11 (operator, public /32)</text>
  <text x="44" y="128" class="t">Tools (future stage)</text>
  <text x="44" y="146" class="s">Terraform (build and destroy)</text>
  <text x="44" y="162" class="s">SSH client, kubectl via SSH tunnel</text>
  <text x="44" y="178" class="s">virtctl v1.9.0 (console, vnc)</text>
  <text x="44" y="194" class="s">curl (external HTTP validation)</text>
  <text x="44" y="220" class="t">Kept outside Git</text>
  <text x="44" y="238" class="s">SSH private key, kubeconfig,</text>
  <text x="44" y="254" class="s">Terraform state, AWS credentials</text>
  <rect x="44" y="266" width="242" height="32" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.3"/>
  <text x="54" y="286" class="r">No credentials in repo or manifests</text>

  <!-- Local lab -->
  <rect x="30" y="330" width="270" height="300" rx="10" class="dash"/>
  <text x="44" y="354" class="c">Local lab (context)</text>
  <text x="44" y="372" class="s">VMnet8 192.168.50.0/24, a Workstation</text>
  <text x="44" y="388" class="s">NAT network: not routable from AWS</text>
  <rect x="44" y="400" width="242" height="96" rx="8" class="box" fill="#fee2e2"/>
  <text x="54" y="420" class="t">ESXi: legacy-source-vm</text>
  <text x="54" y="438" class="s">192.168.50.31, nginx, powered on</text>
  <text x="54" y="454" class="s">stays the reference and rollback</text>
  <text x="54" y="472" class="r">.31 is NOT carried to AWS</text>
  <text x="54" y="488" class="s">(ADR 008)</text>
  <rect x="44" y="506" width="242" height="110" rx="8" class="box" fill="#dcfce7"/>
  <text x="54" y="526" class="t">conversion-host-01</text>
  <text x="54" y="544" class="s">virt-v2v qcow2 (Stage 1G)</text>
  <text x="54" y="560" class="s">+ netplan remediation (ADR 010)</text>
  <text x="54" y="576" class="s">+ offline qemu-guest-agent</text>
  <text x="54" y="592" class="s">on a disposable copy (future)</text>
  <text x="54" y="608" class="s">about 2.7 GiB to transfer</text>

  <!-- AWS region -->
  <rect x="330" y="60" width="880" height="790" rx="12" class="box" fill="#fff7ed"/>
  <text x="346" y="84" class="c">AWS ap-south-1 (Mumbai): disposable, Terraform-built (ADR 002, ADR 007)</text>
  <rect x="346" y="96" width="848" height="742" rx="10" class="box" fill="#ffedd5"/>
  <text x="360" y="118" class="t">VPC, one public subnet, one AZ, internet gateway, no NAT gateway</text>
  <text x="360" y="136" class="s">Security group inbound from operator /32 only: TCP 22 (SSH), TCP 30080 (validation NodePort). API 6443 via SSH tunnel.</text>

  <!-- EC2 instance -->
  <rect x="362" y="150" width="816" height="590" rx="10" class="box" fill="#f8fafc"/>
  <rect x="362" y="150" width="816" height="28" rx="10" fill="#c2410c"/>
  <text x="376" y="169" class="l">EC2 m8i.xlarge (4 vCPU, 16 GiB, Intel), NestedVirtualization=enabled: Nitro passes VT-x to the instance</text>
  <rect x="378" y="188" width="784" height="34" rx="6" class="box" fill="#e0e7ff"/>
  <text x="390" y="210" class="t">CentOS Stream 9 x86_64 | EL9 kernel (aligned with virt-launcher) | kvm_intel, vhost_net, tun | SELinux enforcing | cgroup v2</text>
  <rect x="378" y="228" width="784" height="28" rx="6" class="box" fill="#ede9fe"/>
  <text x="390" y="247" class="t">CRI-O 1.36 (systemd cgroup driver, device_ownership_from_security_context = true)</text>

  <!-- Kubernetes cluster -->
  <rect x="378" y="264" width="784" height="464" rx="8" class="box" fill="#eff6ff"/>
  <text x="392" y="286" class="c">Kubernetes 1.36 (kubeadm), single node: control plane + worker (taint removed)</text>

  <rect x="392" y="298" width="182" height="120" rx="6" class="box" fill="#ffffff"/>
  <text x="402" y="318" class="t">kube-system</text>
  <text x="402" y="336" class="s">apiserver (allow-privileged)</text>
  <text x="402" y="352" class="s">etcd, scheduler,</text>
  <text x="402" y="368" class="s">controller-manager</text>
  <text x="402" y="384" class="s">CoreDNS, kube-proxy</text>
  <text x="402" y="400" class="s">flannel (pod network)</text>

  <rect x="586" y="298" width="182" height="120" rx="6" class="box" fill="#ffffff"/>
  <text x="596" y="318" class="t">kubevirt (v1.9.0)</text>
  <text x="596" y="336" class="s">virt-operator</text>
  <text x="596" y="352" class="s">virt-api, virt-controller</text>
  <text x="596" y="368" class="s">virt-handler</text>
  <text x="596" y="384" class="r">(privileged DaemonSet)</text>

  <rect x="780" y="298" width="182" height="120" rx="6" class="box" fill="#ffffff"/>
  <text x="790" y="318" class="t">cdi (v1.66.1)</text>
  <text x="790" y="336" class="s">cdi-operator, controller</text>
  <text x="790" y="352" class="s">cdi-apiserver</text>
  <text x="790" y="368" class="s">cdi-uploadproxy</text>
  <text x="790" y="384" class="s">(used via port-forward,</text>
  <text x="790" y="400" class="s">never exposed)</text>

  <rect x="974" y="298" width="174" height="120" rx="6" class="box" fill="#ffffff"/>
  <text x="984" y="318" class="t">EBS CSI driver</text>
  <text x="984" y="336" class="s">ebs.csi.aws.com</text>
  <text x="984" y="352" class="s">StorageClass gp3</text>
  <text x="984" y="368" class="s">WaitForFirstConsumer</text>
  <text x="984" y="384" class="s">reclaimPolicy Delete</text>

  <!-- VM -->
  <rect x="392" y="432" width="500" height="284" rx="8" class="box" fill="#ecfdf5"/>
  <text x="404" y="454" class="t">VirtualMachine legacy-source-vm (2 vCPU, 4096 Mi, EFI, Secure Boot off)</text>
  <rect x="406" y="466" width="472" height="238" rx="6" class="box" fill="#ffffff"/>
  <text x="418" y="486" class="t">virt-launcher pod: libvirt + QEMU (CentOS Stream 9 userland)</text>
  <text x="418" y="504" class="s">QEMU uses /dev/kvm (nested virtualization), /dev/vhost-net, /dev/net/tun</text>
  <rect x="420" y="516" width="444" height="176" rx="6" class="box" fill="#dcfce7"/>
  <text x="432" y="536" class="t">Guest: Ubuntu 24.04.5 (converted by virt-v2v)</text>
  <text x="432" y="554" class="s">nginx :80, validation page sha256 b9826e18...0046</text>
  <rect x="432" y="566" width="200" height="54" rx="5" class="box" fill="#ffffff"/>
  <text x="442" y="586" class="t">VirtIO disk vda</text>
  <text x="442" y="604" class="s">bus: virtio, raw Block PVC</text>
  <rect x="648" y="566" width="204" height="54" rx="5" class="box" fill="#ffffff"/>
  <text x="658" y="586" class="t">VirtIO NIC</text>
  <text x="658" y="604" class="s">netplan: driver match, DHCP</text>
  <rect x="432" y="630" width="420" height="50" rx="5" class="box" fill="#fef9c3"/>
  <text x="442" y="650" class="t">masquerade binding: guest 10.0.2.2, gateway 10.0.2.1</text>
  <text x="442" y="668" class="s">NAT to the pod IP (flannel range); no Multus (ADR 008)</text>

  <!-- Service and storage -->
  <rect x="908" y="432" width="240" height="118" rx="8" class="box" fill="#fef9c3"/>
  <text x="920" y="454" class="t">Service (NodePort 30080)</text>
  <text x="920" y="472" class="s">node:30080 -> pod :80</text>
  <text x="920" y="488" class="s">-> DNAT -> guest :80</text>
  <text x="920" y="506" class="s">replaces IP continuity</text>
  <text x="920" y="522" class="s">(stable across restarts)</text>
  <text x="920" y="540" class="g">external HTTP check here</text>

  <rect x="908" y="562" width="240" height="154" rx="8" class="box" fill="#e0f2fe"/>
  <text x="920" y="584" class="t">Storage (ADR 009)</text>
  <text x="920" y="602" class="s">DataVolume (CDI upload)</text>
  <text x="920" y="618" class="s">PVC 40Gi, volumeMode Block,</text>
  <text x="920" y="634" class="s">ReadWriteOnce, raw content</text>
  <text x="920" y="650" class="s">scratch: Filesystem RWO,</text>
  <text x="920" y="666" class="s">only during import</text>
  <text x="920" y="684" class="s">not live-migratable (RWO)</text>

  <!-- EBS and IAM -->
  <rect x="362" y="752" width="400" height="74" rx="8" class="box" fill="#e0f2fe"/>
  <text x="376" y="774" class="t">EBS gp3 volumes (same AZ)</text>
  <text x="376" y="792" class="s">root 50 GiB | VM disk 40 GiB (PVC) |</text>
  <text x="376" y="808" class="s">scratch about 40 GiB (import only)</text>
  <rect x="778" y="752" width="400" height="74" rx="8" class="box" fill="#f1f5f9"/>
  <text x="792" y="774" class="t">IAM instance profile</text>
  <text x="792" y="792" class="s">AmazonEBSCSIDriverPolicyV2 only; no static keys</text>
  <text x="792" y="808" class="s">IMDSv2 required, hop limit 2 (EBS CSI)</text>

  <!-- arrows -->
  <path d="M300,196 L374,196" class="arr"/>
  <text x="304" y="188" class="s">SSH 22</text>
  <path d="M300,244 L374,244" class="arr"/>
  <text x="304" y="236" class="s">HTTP</text>
  <text x="304" y="262" class="s">30080</text>
  <path d="M286,560 C 320,560 330,700 360,780" class="darr"/>
  <text x="196" y="650" class="s">scp qcow2 (future)</text>
  <path d="M286,448 L326,448" class="xarr"/>
  <path d="M440,752 L440,718" class="darr"/>

  <!-- legend -->
  <rect x="30" y="862" width="1180" height="56" rx="8" class="box" fill="#f8fafc"/>
  <line x1="46" y1="882" x2="86" y2="882" class="arr"/>
  <text x="94" y="886" class="n">management and validation traffic</text>
  <line x1="330" y1="882" x2="370" y2="882" class="darr"/>
  <text x="378" y="886" class="n">disk data path (future stage)</text>
  <line x1="590" y1="882" x2="630" y2="882" class="xarr"/>
  <text x="638" y="886" class="n">no network path (.31 stays local)</text>
  <text x="46" y="906" class="n">Versions: Kubernetes 1.36, KubeVirt v1.9.0, CDI v1.66.1, CRI-O 1.36, CentOS Stream 9. Chosen target for the first KubeVirt migration; not a claim about production suitability.</text>
</svg>

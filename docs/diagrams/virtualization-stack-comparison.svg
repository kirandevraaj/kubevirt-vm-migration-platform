<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">ESXi VM vs KubeVirt VM vs Kubernetes Pod</title>
  <desc id="desc">Three stacks compared: a traditional ESXi virtual machine, a virtual machine managed by Kubernetes through KubeVirt, and a native containerized application running as a Pod.</desc>
  <style>
    .h { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .c { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .t { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #111827; }
    .s { font: 11.5px 'Segoe UI', Arial, sans-serif; fill: #374151; }
    .n { font: italic 12px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    .box { stroke: #334155; stroke-width: 1.3; }
  </style>
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" class="h">Three ways to run nginx: ESXi VM, KubeVirt VM, Kubernetes Pod</text>

  <!-- Column A -->
  <text x="190" y="72" text-anchor="middle" class="c">A. VM on ESXi</text>
  <rect x="40" y="90" width="300" height="62" rx="8" class="box" fill="#dcfce7"/>
  <text x="190" y="114" text-anchor="middle" class="t">Guest OS (own kernel) + nginx</text>
  <text x="190" y="134" text-anchor="middle" class="s">drivers: vmxnet3, pvscsi, VMware Tools</text>
  <rect x="40" y="162" width="300" height="62" rx="8" class="box" fill="#e0f2fe"/>
  <text x="190" y="186" text-anchor="middle" class="t">VMX process + VMM (per VM)</text>
  <text x="190" y="206" text-anchor="middle" class="s">virtual hardware: vNIC, SCSI ctrl, VMDK disks</text>
  <rect x="40" y="234" width="300" height="118" rx="8" class="box" fill="#fef3c7"/>
  <text x="190" y="258" text-anchor="middle" class="t">VMkernel (ESXi hypervisor OS)</text>
  <text x="190" y="280" text-anchor="middle" class="s">CPU scheduler, memory manager</text>
  <text x="190" y="298" text-anchor="middle" class="s">vSwitch / port groups</text>
  <text x="190" y="316" text-anchor="middle" class="s">VMFS datastore, storage stack</text>
  <text x="190" y="334" text-anchor="middle" class="s">hostd (managed by Host Client / vCenter)</text>
  <rect x="40" y="362" width="300" height="50" rx="8" class="box" fill="#e5e7eb"/>
  <text x="190" y="392" text-anchor="middle" class="t">Physical server (VT-x / EPT)</text>
  <text x="190" y="446" text-anchor="middle" class="n">Unit of management: the VM</text>
  <text x="190" y="466" text-anchor="middle" class="n">Control plane: vCenter / Host Client</text>

  <!-- Column B -->
  <text x="550" y="72" text-anchor="middle" class="c">B. VM on Kubernetes (KubeVirt)</text>
  <rect x="400" y="90" width="300" height="62" rx="8" class="box" fill="#dcfce7"/>
  <text x="550" y="114" text-anchor="middle" class="t">Guest OS (own kernel) + nginx</text>
  <text x="550" y="134" text-anchor="middle" class="s">drivers: virtio-net, virtio-blk, qemu-guest-agent</text>
  <rect x="400" y="162" width="300" height="62" rx="8" class="box" fill="#e0f2fe"/>
  <text x="550" y="186" text-anchor="middle" class="t">QEMU process (driven by libvirt)</text>
  <text x="550" y="206" text-anchor="middle" class="s">virtual hardware: virtio devices, disk from PVC</text>
  <rect x="400" y="234" width="300" height="50" rx="8" class="box" fill="#ede9fe"/>
  <text x="550" y="256" text-anchor="middle" class="t">virt-launcher Pod (compute container)</text>
  <text x="550" y="274" text-anchor="middle" class="s">cgroups + namespaces for the QEMU process</text>
  <rect x="400" y="294" width="300" height="58" rx="8" class="box" fill="#fce7f3"/>
  <text x="550" y="316" text-anchor="middle" class="t">kubelet + containerd + virt-handler</text>
  <text x="550" y="336" text-anchor="middle" class="s">CNI network, CSI storage</text>
  <rect x="400" y="362" width="300" height="50" rx="8" class="box" fill="#fef3c7"/>
  <text x="550" y="384" text-anchor="middle" class="t">Linux kernel + KVM module (/dev/kvm)</text>
  <text x="550" y="402" text-anchor="middle" class="s">CPU + memory virtualization</text>
  <rect x="400" y="422" width="300" height="42" rx="8" class="box" fill="#e5e7eb"/>
  <text x="550" y="448" text-anchor="middle" class="t">Physical or cloud host (VT-x / EPT)</text>
  <text x="550" y="494" text-anchor="middle" class="n">Unit of management: VirtualMachine custom resource</text>
  <text x="550" y="514" text-anchor="middle" class="n">Control plane: Kubernetes API + KubeVirt controllers</text>

  <!-- Column C -->
  <text x="910" y="72" text-anchor="middle" class="c">C. Native app as a Pod</text>
  <rect x="760" y="90" width="300" height="62" rx="8" class="box" fill="#dcfce7"/>
  <text x="910" y="114" text-anchor="middle" class="t">nginx process in a container</text>
  <text x="910" y="134" text-anchor="middle" class="s">no guest kernel, no virtual hardware</text>
  <rect x="760" y="162" width="300" height="62" rx="8" class="box" fill="#ede9fe"/>
  <text x="910" y="186" text-anchor="middle" class="t">Pod (from a Deployment)</text>
  <text x="910" y="206" text-anchor="middle" class="s">cgroups + namespaces, image from registry</text>
  <rect x="760" y="234" width="300" height="118" rx="8" class="box" fill="#fce7f3"/>
  <text x="910" y="258" text-anchor="middle" class="t">kubelet + containerd</text>
  <text x="910" y="280" text-anchor="middle" class="s">CNI network, CSI storage</text>
  <text x="910" y="298" text-anchor="middle" class="s">Service / Ingress for traffic</text>
  <text x="910" y="316" text-anchor="middle" class="s">ReplicaSet for scale + self-healing</text>
  <rect x="760" y="362" width="300" height="50" rx="8" class="box" fill="#fef3c7"/>
  <text x="910" y="384" text-anchor="middle" class="t">Linux kernel (shared by all containers)</text>
  <text x="910" y="402" text-anchor="middle" class="s">no KVM needed</text>
  <rect x="760" y="422" width="300" height="42" rx="8" class="box" fill="#e5e7eb"/>
  <text x="910" y="448" text-anchor="middle" class="t">Physical or cloud host</text>
  <text x="910" y="494" text-anchor="middle" class="n">Unit of management: Deployment / Pod</text>
  <text x="910" y="514" text-anchor="middle" class="n">Control plane: Kubernetes API</text>

  <rect x="40" y="548" width="1020" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="60" y="574" class="t">A and B both run a full guest OS with its own kernel on virtual hardware. Only the manager changes: VMkernel/vCenter vs Linux KVM + Kubernetes.</text>
  <text x="60" y="598" class="t">C removes the VM entirely: the application shares the node kernel. Moving from A to B is migration; moving from A or B to C is modernization.</text>
</svg>

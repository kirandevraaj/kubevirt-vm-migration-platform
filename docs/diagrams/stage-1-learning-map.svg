<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180" role="img" aria-labelledby="title desc">
  <title id="title">Stage 1 learning map: from a VMware VM to a Kubernetes-managed VM and, later, a native workload</title>
  <desc id="desc">A vertical journey with Stage 1 sub-stage labels. VMware world: VMware Workstation on the laptop runs nested ESXi (1A proved it survives a reboot), which runs legacy-source-vm, an Ubuntu and nginx VM with VMware devices and the static address 192.168.50.31 (1C). Its disk is a VMDK made of a text descriptor and a 40 GiB flat extent (1D). Moving the disk: a cold acquisition made a byte-identical golden copy on Windows (1E). KVM world: the conversion lab on conversion-host-01 inspected a working copy read-only (1F), and converted disks booted under QEMU/KVM with UEFI and VirtIO, needing a netplan fix for networking (1G). A side branch, Stage 1B, used kvm-learning-01 to learn KVM, QEMU, libvirt and VirtIO and proved nested KVM works. Kubernetes world: the KubeVirt target is designed but not built (1H), and running the migrated VM on Kubernetes is a future stage. Modernization: later, nginx may become a container workload. Solid boxes are done and observed, dashed boxes are designed only, grey dotted boxes are future.</desc>
  <style>
    .h { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .band { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    .t { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #111827; }
    .s { font: 12px 'Segoe UI', Arial, sans-serif; fill: #374151; }
    .n { font: 12px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    .p { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
    .r { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #b91c1c; }
    .box { stroke: #334155; stroke-width: 1.3; }
    .des { stroke: #334155; stroke-width: 1.4; stroke-dasharray: 7 4; }
    .fut { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 2 3; }
    .arr { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#a); }
    .darr { stroke: #64748b; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#g); }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1000" height="1180" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" class="h">Stage 1 learning map: VMware VM to Kubernetes-managed VM</text>

  <!-- world bands -->
  <rect x="20" y="66" width="170" height="392" rx="8" fill="#eff6ff"/>
  <text x="32" y="90" class="band">VMware world</text>
  <text x="32" y="108" class="n">where the VM</text>
  <text x="32" y="124" class="n">lives today</text>
  <rect x="20" y="466" width="170" height="92" rx="8" fill="#fef3c7"/>
  <text x="32" y="490" class="band">Moving the disk</text>
  <text x="32" y="508" class="n">only the disk bytes</text>
  <text x="32" y="524" class="n">travel</text>
  <rect x="20" y="566" width="170" height="192" rx="8" fill="#ecfdf5"/>
  <text x="32" y="590" class="band">KVM world</text>
  <text x="32" y="608" class="n">conversion lab</text>
  <text x="32" y="624" class="n">(outside VMware's</text>
  <text x="32" y="640" class="n">hypervisor)</text>
  <rect x="20" y="766" width="170" height="192" rx="8" fill="#fff7ed"/>
  <text x="32" y="790" class="band">Kubernetes world</text>
  <text x="32" y="808" class="n">the VM becomes a</text>
  <text x="32" y="824" class="n">Kubernetes object</text>
  <rect x="20" y="966" width="170" height="92" rx="8" fill="#f1f5f9"/>
  <text x="32" y="990" class="band">Modernization</text>
  <text x="32" y="1008" class="n">the VM goes away</text>

  <!-- stage pills -->
  <rect x="200" y="182" width="44" height="26" rx="13" fill="#1d4ed8"/><text x="222" y="200" text-anchor="middle" class="p">1A</text>
  <rect x="200" y="282" width="44" height="26" rx="13" fill="#1d4ed8"/><text x="222" y="300" text-anchor="middle" class="p">1C</text>
  <rect x="200" y="382" width="44" height="26" rx="13" fill="#1d4ed8"/><text x="222" y="400" text-anchor="middle" class="p">1D</text>
  <rect x="200" y="482" width="44" height="26" rx="13" fill="#b45309"/><text x="222" y="500" text-anchor="middle" class="p">1E</text>
  <rect x="200" y="582" width="44" height="26" rx="13" fill="#15803d"/><text x="222" y="600" text-anchor="middle" class="p">1F</text>
  <rect x="200" y="682" width="44" height="26" rx="13" fill="#15803d"/><text x="222" y="700" text-anchor="middle" class="p">1G</text>
  <rect x="200" y="782" width="44" height="26" rx="13" fill="#c2410c"/><text x="222" y="800" text-anchor="middle" class="p">1H</text>

  <!-- main journey -->
  <rect x="256" y="74" width="420" height="72" rx="8" class="box" fill="#e0e7ff"/>
  <text x="270" y="100" class="t">VMware Workstation on the Windows laptop</text>
  <text x="270" y="120" class="s">runs ESXi itself as a VM (the outermost hypervisor, L0)</text>

  <rect x="256" y="174" width="420" height="72" rx="8" class="box" fill="#dbeafe"/>
  <text x="270" y="200" class="t">ESXi 8.0.3 (esxi-8-lab, 192.168.50.11)</text>
  <text x="270" y="220" class="s">proved: survives a controlled reboot, all config persists</text>

  <rect x="256" y="274" width="420" height="72" rx="8" class="box" fill="#fee2e2"/>
  <text x="270" y="300" class="t">legacy-source-vm: Ubuntu 24.04.5 + nginx</text>
  <text x="270" y="320" class="s">PVSCSI disk, VMXNET3 NIC, UEFI, static 192.168.50.31; baselined</text>

  <rect x="256" y="374" width="420" height="72" rx="8" class="box" fill="#fef9c3"/>
  <text x="270" y="400" class="t">VMDK = text descriptor + 40 GiB flat extent</text>
  <text x="270" y="420" class="s">only the disk moves; the disk is locked while the VM runs</text>

  <rect x="256" y="474" width="420" height="72" rx="8" class="box" fill="#fde68a"/>
  <text x="270" y="500" class="t">Cold acquisition: golden copy on Windows</text>
  <text x="270" y="520" class="s">graceful shutdown, scp, the same sha256 three times, VM back on</text>

  <rect x="256" y="574" width="420" height="72" rx="8" class="box" fill="#dcfce7"/>
  <text x="270" y="600" class="t">Conversion lab: conversion-host-01</text>
  <text x="270" y="620" class="s">read-only inspection of an immutable working copy</text>

  <rect x="256" y="674" width="420" height="72" rx="8" class="box" fill="#bbf7d0"/>
  <text x="270" y="700" class="t">Converted disk boots on QEMU/KVM</text>
  <text x="270" y="720" class="s">both paths boot with UEFI + VirtIO; network needs a netplan fix</text>

  <rect x="256" y="774" width="420" height="72" rx="8" class="des" fill="#ffedd5"/>
  <text x="270" y="800" class="t">KubeVirt target: designed, not built</text>
  <text x="270" y="820" class="s">kubeadm, one EC2 nested-virt node, CDI upload, masquerade</text>

  <rect x="256" y="874" width="420" height="72" rx="8" class="fut" fill="#f8fafc"/>
  <text x="270" y="900" class="t">Kubernetes-managed VM (future stage)</text>
  <text x="270" y="920" class="s">VirtualMachine, virt-launcher pod, QEMU/KVM, Ubuntu, nginx</text>

  <rect x="256" y="974" width="420" height="72" rx="8" class="fut" fill="#f8fafc"/>
  <text x="270" y="1000" class="t">Future modernization: native workload</text>
  <text x="270" y="1020" class="s">nginx in a container: Deployment + Service (Stage 0 model)</text>

  <path d="M466,146 L466,172" class="arr"/>
  <path d="M466,246 L466,272" class="arr"/>
  <path d="M466,346 L466,372" class="arr"/>
  <path d="M466,446 L466,472" class="arr"/>
  <path d="M466,546 L466,572" class="arr"/>
  <path d="M466,646 L466,672" class="arr"/>
  <path d="M466,746 L466,772" class="darr"/>
  <path d="M466,846 L466,872" class="darr"/>
  <path d="M466,946 L466,972" class="darr"/>

  <!-- right column: 1B branch and notes -->
  <rect x="700" y="274" width="280" height="44" rx="8" fill="#fff1f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="712" y="292" class="r">192.168.50.31 stays on the laptop</text>
  <text x="712" y="309" class="s">not preserved in the target (ADR 008)</text>
  <path d="M676,296 L698,296" class="darr"/>

  <rect x="700" y="374" width="280" height="150" rx="8" class="box" fill="#ede9fe"/>
  <rect x="712" y="384" width="44" height="26" rx="13" fill="#6d28d9"/><text x="734" y="402" text-anchor="middle" class="p">1B</text>
  <text x="764" y="402" class="t">learning branch</text>
  <text x="712" y="430" class="s">kvm-learning-01 on ESXi taught KVM,</text>
  <text x="712" y="446" class="s">QEMU, libvirt and VirtIO</text>
  <text x="712" y="468" class="s">nested KVM works (a KVM-accelerated</text>
  <text x="712" y="484" class="s">L3 guest), but VM exits are very slow:</text>
  <text x="712" y="500" class="s">learning and functional tests only</text>
  <path d="M840,524 L840,710 L678,710" class="darr"/>
  <text x="848" y="620" class="n">same concepts</text>
  <text x="848" y="636" class="n">reused in 1F/1G</text>

  <rect x="700" y="874" width="280" height="172" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="712" y="898" class="t">Remember</text>
  <text x="712" y="920" class="s">Migration keeps the VM: same guest OS,</text>
  <text x="712" y="936" class="s">new manager (KVM + KubeVirt).</text>
  <text x="712" y="960" class="s">Modernization removes the VM: the</text>
  <text x="712" y="976" class="s">app runs as containers.</text>
  <text x="712" y="1000" class="s">A VM on KubeVirt is still a VM.</text>

  <!-- legend -->
  <rect x="20" y="1078" width="960" height="86" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
  <rect x="36" y="1094" width="36" height="20" rx="4" class="box" fill="#dcfce7"/>
  <text x="80" y="1109" class="n">done in Stage 1 (OBSERVED in the lab)</text>
  <rect x="330" y="1094" width="36" height="20" rx="4" class="des" fill="#ffedd5"/>
  <text x="374" y="1109" class="n">designed only (Stage 1H; nothing provisioned)</text>
  <rect x="660" y="1094" width="36" height="20" rx="4" class="fut" fill="#f8fafc"/>
  <text x="704" y="1109" class="n">future stage (not started)</text>
  <text x="36" y="1144" class="n">Stage labels show where each step happened. 1B is a side branch: it built the KVM knowledge used later, not part of the disk's path.</text>
</svg>

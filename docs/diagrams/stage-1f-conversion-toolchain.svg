<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" role="img" aria-labelledby="title desc">
  <title id="title">Stage 1F: conversion toolchain and read-only inspection of the working copy</title>
  <desc id="desc">The golden Stage 1E artifact on the Windows host is a read-only source. It was copied once by scp to a working copy on conversion-host-01, verified by sha256 and locked read-only and immutable. qemu-img reads the disk container, libguestfs and guestfish read partitions and guest files in a read-only appliance, and virt-v2v was used for documentation and capability only. A future conversion step and a KubeVirt/CDI import are not started. legacy-source-vm keeps running and was not accessed for modification; kvm-learning-01 stays powered off.</desc>
  <style>
    .h { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .c { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    .t { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #111827; }
    .s { font: 11.5px 'Segoe UI', Arial, sans-serif; fill: #374151; }
    .l { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
    .n { font: 12px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    .r { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #b91c1c; }
    .box { stroke: #334155; stroke-width: 1.3; }
    .dash { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 7 5; fill: #f8fafc; }
    .arr { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .darr { stroke: #94a3b8; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#g); }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1240" height="880" fill="#ffffff"/>
  <text x="620" y="32" text-anchor="middle" class="h">Stage 1F: conversion toolchain, inspection only (OBSERVED 2026-09-27)</text>

  <!-- Windows host with golden artifact -->
  <rect x="30" y="56" width="280" height="440" rx="10" class="box" fill="#f1f5f9"/>
  <text x="46" y="80" class="c">Windows 11 host (L0)</text>
  <text x="46" y="98" class="s">outside Git</text>
  <rect x="44" y="110" width="252" height="372" rx="8" class="box" fill="#fef3c7"/>
  <rect x="44" y="110" width="252" height="26" rx="8" fill="#d97706"/>
  <text x="56" y="128" class="l">GOLDEN ARTIFACT (Stage 1E)</text>
  <text x="56" y="156" class="t">READ-ONLY SOURCE</text>
  <text x="56" y="174" class="s">C:\VMs\legacy-source-vm\stage-1e\</text>
  <text x="56" y="198" class="t">legacy-source-vm.vmdk</text>
  <text x="56" y="214" class="s">541 B descriptor, sha256 5b407e06...e9ff</text>
  <text x="56" y="236" class="t">legacy-source-vm-flat.vmdk</text>
  <text x="56" y="252" class="s">40 GiB raw extent, sha256 72ca45c7...c9e7</text>
  <text x="56" y="274" class="t">reference\ .vmx .nvram .vmxf</text>
  <text x="56" y="290" class="s">VM metadata, reference only</text>
  <rect x="56" y="308" width="228" height="160" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="68" y="330" class="r">NEVER MODIFIED</text>
  <text x="68" y="350" class="s">hash, size, LastWriteTimeUtc and</text>
  <text x="68" y="366" class="s">attributes identical before (14:43)</text>
  <text x="68" y="382" class="s">and after (15:30)</text>
  <text x="68" y="404" class="s">opened only for reading:</text>
  <text x="68" y="420" class="s">Get-FileHash and scp</text>
  <text x="68" y="442" class="s">no tool ran against it;</text>
  <text x="68" y="458" class="s">all work used the working copy</text>

  <!-- copy arrow -->
  <path d="M296,250 L376,250" class="arr"/>
  <text x="343" y="240" text-anchor="middle" class="s">scp once</text>
  <text x="343" y="268" text-anchor="middle" class="s">231 MiB/s</text>

  <!-- conversion-host-01 -->
  <rect x="380" y="56" width="480" height="560" rx="10" class="box" fill="#dbeafe"/>
  <text x="396" y="80" class="c">conversion-host-01 (Vmid 3 on esxi-8-lab, L2)</text>
  <text x="396" y="98" class="s">Ubuntu 24.04.5, 4 vCPU, 8 GB, 60 GB thin, 192.168.50.32, vhv.enable = TRUE</text>

  <rect x="396" y="110" width="448" height="118" rx="8" class="box" fill="#dcfce7"/>
  <rect x="396" y="110" width="448" height="26" rx="8" fill="#16a34a"/>
  <text x="408" y="128" class="l">WORKING COPY  /srv/migration-lab/working/</text>
  <text x="408" y="156" class="s">descriptor + flat extent, sha256 = golden as received and after re-sparsifying</text>
  <text x="408" y="174" class="s">(allocated 40 GiB -> 3.14 GiB by fallocate --dig-holes; content unchanged)</text>
  <text x="408" y="192" class="s">chmod 0444 + chattr +i (immutable, even for root); never attached to a VM</text>
  <text x="408" y="212" class="t">re-hashed after every inspection step: always OK</text>

  <path d="M620,230 L620,258" class="arr"/>
  <text x="628" y="250" class="s">read-only access only</text>

  <rect x="396" y="262" width="448" height="92" rx="8" class="box" fill="#ffffff"/>
  <text x="408" y="282" class="t">qemu-img 8.2.2: DISK CONTAINER view</text>
  <text x="408" y="300" class="s">info, --backing-chain, map, check (no -r, no -U)</text>
  <text x="408" y="316" class="s">vmdk, create type vmfs, 1 extent, 40 GiB virtual, no backing file</text>
  <text x="408" y="332" class="s">3,219 MiB non-zero data; "No errors were found on the image."</text>
  <text x="408" y="348" class="s">flat extent alone probes as raw</text>

  <rect x="396" y="364" width="448" height="120" rx="8" class="box" fill="#ffffff"/>
  <text x="408" y="384" class="t">libguestfs 1.52.0 / guestfish --ro: PARTITION and GUEST FS view</text>
  <text x="408" y="402" class="s">appliance VM (L3) runs under KVM (kvm-clock, /dev/kvm open);</text>
  <text x="408" y="418" class="s">TCG boots it faster in this nested lab (19 s vs 34 s)</text>
  <text x="408" y="436" class="s">GPT: ESP vfat C340-CD01, ext4 db8b3bb3-...; Ubuntu 24.04.5</text>
  <text x="408" y="452" class="s">netplan ens192, cloud-init disabled, open-vm-tools enabled,</text>
  <text x="408" y="468" class="s">virtio built in; guest root mounted read-only (ST_RDONLY)</text>

  <rect x="396" y="494" width="448" height="108" rx="8" class="box" fill="#ffffff"/>
  <text x="408" y="514" class="t">virt-v2v 2.4.0: DOCUMENTATION AND CAPABILITY ONLY</text>
  <text x="408" y="532" class="s">inputs: disk (= local), libvirt, libvirtxml, ova, vmx (local or ssh)</text>
  <text x="408" y="548" class="s">outputs: local, qemu, libvirt, kubevirt (experimental), openstack, ...</text>
  <text x="408" y="566" class="r">not run against the image; no connection to ESXi</text>
  <text x="408" y="584" class="s">--help, --machine-readable and installed man pages only</text>

  <!-- future boundary -->
  <rect x="890" y="56" width="320" height="560" rx="10" class="dash"/>
  <text x="906" y="80" class="t">FUTURE - NOT STARTED IN STAGE 1F</text>

  <rect x="910" y="110" width="280" height="190" rx="8" class="dash"/>
  <text x="924" y="134" class="t">future conversion (Stage 1G+)</text>
  <text x="924" y="156" class="s">method not chosen:</text>
  <text x="924" y="172" class="s">A: qemu-img container change</text>
  <text x="924" y="188" class="s">+ manual guest adaptation, or</text>
  <text x="924" y="204" class="s">B: virt-v2v guest conversion</text>
  <text x="924" y="228" class="s">target image format NOT chosen</text>
  <text x="924" y="244" class="s">(raw / qcow2 decided later)</text>
  <text x="924" y="268" class="s">input: a verified working copy,</text>
  <text x="924" y="284" class="s">output: a new path, never the golden</text>

  <path d="M1050,302 L1050,352" class="darr"/>

  <rect x="910" y="356" width="280" height="160" rx="8" class="dash"/>
  <text x="924" y="380" class="t">KubeVirt / CDI target</text>
  <text x="924" y="402" class="s">not installed; no Kubernetes,</text>
  <text x="924" y="418" class="s">no KubeVirt, no CDI, no AWS</text>
  <text x="924" y="442" class="s">CDI would import the disk into a PVC;</text>
  <text x="924" y="458" class="s">a VirtualMachine spec would re-express</text>
  <text x="924" y="474" class="s">CPU, RAM, EFI, disk bus and NIC</text>
  <text x="924" y="498" class="s">(workflow C)</text>

  <path d="M844,420 C 874,420 874,205 906,205" class="darr"/>
  <rect x="856" y="296" width="32" height="22" fill="#ffffff"/>
  <text x="872" y="312" text-anchor="middle" class="r">NO</text>
  <text x="900" y="560" class="r">No conversion, resize, repair,</text>
  <text x="900" y="578" class="r">boot or image rewrite in Stage 1F</text>

  <!-- ESXi context -->
  <rect x="30" y="640" width="1180" height="130" rx="10" class="box" fill="#eff6ff"/>
  <text x="46" y="664" class="c">esxi-8-lab (L1: ESXi 8.0.3, 192.168.50.11): VMs during and after Stage 1F</text>
  <rect x="46" y="678" width="370" height="80" rx="6" class="box" fill="#e5e7eb"/>
  <text x="58" y="698" class="t">legacy-source-vm (Vmid 2), running, .31</text>
  <text x="58" y="716" class="s">NOT accessed for modification: only HTTP health</text>
  <text x="58" y="732" class="s">checks and ESXi status queries; page sha256 and</text>
  <text x="58" y="748" class="s">snapshot count (0) unchanged before and after</text>
  <rect x="430" y="678" width="370" height="80" rx="6" class="box" fill="#e5e7eb"/>
  <text x="442" y="698" class="t">kvm-learning-01 (Vmid 1), powered off</text>
  <text x="442" y="716" class="s">not used as the conversion host; not powered on</text>
  <text x="442" y="732" class="s">(the learning VM keeps its own role)</text>
  <rect x="814" y="678" width="380" height="80" rx="6" class="box" fill="#dbeafe"/>
  <text x="826" y="698" class="t">conversion-host-01 (Vmid 3), running, .32</text>
  <text x="826" y="716" class="s">new in Stage 1F; 7.5 GiB allocated after fstrim;</text>
  <text x="826" y="732" class="s">datastore free 179.3 GB -> 163.7 GB (incl. 8 GiB .vswp)</text>
  <text x="826" y="748" class="s">Windows free RAM stayed at 6 GiB or more</text>

  <!-- Legend -->
  <rect x="30" y="786" width="1180" height="82" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="46" y="808" class="t">Legend</text>
  <rect x="110" y="797" width="14" height="14" fill="#d97706"/><text x="130" y="809" class="n">golden artifact (read-only source)</text>
  <rect x="360" y="797" width="14" height="14" fill="#16a34a"/><text x="380" y="809" class="n">working copy</text>
  <rect x="490" y="797" width="14" height="14" fill="#dbeafe" stroke="#334155"/><text x="510" y="809" class="n">conversion host and tools</text>
  <rect x="690" y="797" width="14" height="14" fill="#e5e7eb" stroke="#334155"/><text x="710" y="809" class="n">other VMs, not touched</text>
  <text x="46" y="834" class="n">Solid boxes exist now (OBSERVED). Dashed boxes and dashed arrows are future steps that have not started. Red text marks what Stage 1F did not do.</text>
  <text x="46" y="854" class="n">Data flowed one way only: golden -> working copy. Only text evidence came back to Windows.</text>
</svg>
